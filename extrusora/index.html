<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b13"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>DF • Central Técnica de Extrusão</title><style>html,body{margin:0;min-height:100%;background:#080b13;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}.boot{max-width:520px;margin:90px auto;padding:24px;text-align:center}.boot p{color:#94a3b8;line-height:1.5}.boot button{margin-top:14px;border:1px solid #f5a000;background:#241600;color:#ffd36a;border-radius:12px;padding:12px 18px;font-weight:900}</style></head><body><div class="boot"><h2>DF • Central Técnica de Extrusão</h2><p>Carregando ferramenta técnica...</p></div><script>(async()=>{async function ungzip(raw){if('DecompressionStream' in window){try{const ds=new DecompressionStream('gzip');return await new Response(new Blob([raw]).stream().pipeThrough(ds)).text()}catch(e){}}try{const mod=await import('https://cdn.jsdelivr.net/npm/pako@2.1.0/+esm');const fn=mod.ungzip||mod.inflate;const out=fn(raw,{to:'string'});return typeof out==='string'?out:new TextDecoder().decode(out)}catch(e1){}return await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';s.onload=()=>{try{if(!window.pako)throw new Error('pako indisponível');const out=(window.pako.ungzip||window.pako.inflate)(raw,{to:'string'});resolve(typeof out==='string'?out:new TextDecoder().decode(out))}catch(e){reject(e)}};s.onerror=()=>reject(new Error('Falha ao carregar compatibilidade'));document.head.appendChild(s)})}try{const base=await fetch('./base-v6.html?v=central-v6-compat',{cache:'no-store'});if(!base.ok)throw new Error('Base indisponível');const wrapper=await base.text();const m=wrapper.match(/atob\('([^']+)'\)/);if(!m)throw new Error('Base inválida');const raw=Uint8Array.from(atob(m[1]),c=>c.charCodeAt(0));let txt=await ungzip(raw);txt=txt.replace('</body>','<script src="./rosca-compressao-v7.js?v=7.1"></scr'+'ipt></body>');document.open();document.write(txt);document.close()}catch(e){document.body.innerHTML='<div class="boot"><h2>DF • Central Técnica de Extrusão</h2><p>Não foi possível carregar neste navegador.</p><button onclick="location.reload()">TENTAR NOVAMENTE</button></div>'}})();</script></body></html>
