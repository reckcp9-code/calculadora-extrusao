<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b13">
<meta name="color-scheme" content="dark">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>DF EXTRUSOR PRO</title>
<style>html,body{margin:0;min-height:100%;background:#080b13!important;color:#f8fafc}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}</style>
<script src="./device-identity.js?v=20260908-boot-stable-v98"></script>
</head>
<body>
<div id="dfBootStatus" style="max-width:520px;margin:80px auto;padding:24px;text-align:center;color:#f8fafc">
  <h2 style="margin-bottom:10px">DF EXTRUSOR PRO</h2>
  <p style="color:#94a3b8">Carregando calculadora...</p>
</div>
<script>
(async()=>{
  const COMMIT='3e570fc08be61679377cd81eb4e90bc45216f4c2';
  const RAW='https://raw.githubusercontent.com/reckcp9-code/calculadora-extrusao/'+COMMIT+'/app.html';
  const CDN='https://cdn.jsdelivr.net/gh/reckcp9-code/calculadora-extrusao@'+COMMIT+'/app.html';
  const API='https://api.github.com/repos/reckcp9-code/calculadora-extrusao/contents/app.html?ref='+COMMIT;
  const SHELL_CACHE='df-app-shell-source-v1';
  const SHELL_KEY='./__df_base_shell__.html';

  const safeGet=(k)=>{try{return localStorage.getItem(k)}catch(e){return null}};

  async function fetchText(url,timeout=7000){
    let ctrl=null,timer=null;
    try{
      if('AbortController' in window){
        ctrl=new AbortController();
        timer=setTimeout(()=>ctrl.abort(),timeout);
      }
      const r=await fetch(url,{cache:'no-store',signal:ctrl?ctrl.signal:undefined});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const txt=await r.text();
      if(!txt||txt.indexOf('<!doctype html')<0)throw new Error('Conteúdo inválido');
      return txt;
    }finally{if(timer)clearTimeout(timer)}
  }

  async function fetchApiShell(){
    let ctrl=null,timer=null;
    try{
      if('AbortController' in window){ctrl=new AbortController();timer=setTimeout(()=>ctrl.abort(),7000)}
      const r=await fetch(API,{cache:'no-store',headers:{'Accept':'application/vnd.github+json'},signal:ctrl?ctrl.signal:undefined});
      if(!r.ok)throw new Error('GitHub API HTTP '+r.status);
      const j=await r.json();
      const b64=String(j&&j.content||'').replace(/\s/g,'');
      if(!b64)throw new Error('GitHub API sem conteúdo');
      const bin=atob(b64);
      const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      const txt=('TextDecoder' in window)?new TextDecoder('utf-8').decode(bytes):decodeURIComponent(escape(bin));
      if(!txt||txt.indexOf('<!doctype html')<0)throw new Error('Conteúdo inválido');
      return txt;
    }finally{if(timer)clearTimeout(timer)}
  }

  async function readCachedShell(){
    try{
      if(!('caches' in window))return '';
      const c=await caches.open(SHELL_CACHE);
      const r=await c.match(SHELL_KEY);
      const txt=r?await r.text():'';
      return txt&&txt.indexOf('<!doctype html')>=0?txt:'';
    }catch(e){return ''}
  }

  async function saveCachedShell(txt){
    try{
      if(!('caches' in window)||!txt)return;
      const c=await caches.open(SHELL_CACHE);
      await c.put(SHELL_KEY,new Response(txt,{headers:{'Content-Type':'text/html; charset=utf-8'}}));
    }catch(e){}
  }

  async function refreshShellInBackground(){
    try{
      const txt=await fetchText(RAW,7000);
      await saveCachedShell(txt);
    }catch(e){}
  }

  async function loadShell(){
    // A base é presa a um commit imutável. Se já existe no aparelho,
    // abre imediatamente do cache e atualiza silenciosamente ao fundo.
    const cached=await readCachedShell();
    if(cached){
      setTimeout(refreshShellInBackground,1200);
      return cached;
    }

    for(const src of [RAW,CDN]){
      try{
        const txt=await fetchText(src,7000);
        await saveCachedShell(txt);
        return txt;
      }catch(e){}
    }

    try{
      const txt=await fetchApiShell();
      await saveCachedShell(txt);
      return txt;
    }catch(e){}

    throw new Error('Falha ao carregar a base da calculadora');
  }

  try{
    const savedAccess=String(safeGet('df_auto_access_credential_v1')||'').trim();
    let h=await loadShell();

    // Mantém o fundo escuro durante toda a troca de documento para evitar flash branco.
    h=h.replace('</head>','<style id="dfStableBoot">html,body{background:#080b13!important}body{opacity:1!important;visibility:visible!important}</style></head>');
    if(savedAccess&&navigator.onLine!==false){
      h=h.replace('</head>','<style id="dfSavedAccessBoot">#licenseGate{display:none!important}#appContent{display:block!important}</style></head>');
    }

    const closeScript='</scr'+'ipt>';
    const openScript='<scr'+'ipt>';
    const p=h.lastIndexOf(openScript);
    if(p>=0){const e=h.indexOf(closeScript,p);if(e>=0)h=h.slice(0,p)+h.slice(e+closeScript.length)}

    const scripts=[
      'offline-auth-shim.js?v=20260908-online-required-v100',
      'platform-hint.js?v=20260908-boot-stable-v98',
      'install-handoff.js?v=20260908-boot-stable-v98',
      'auto-access.js?v=20260908-online-required-v100',
      'auto-user.js?v=20260908-boot-stable-v98',
      'beta-launch.js?v=20260908-boot-stable-v98',
      'access-device-guard.js?v=20260908-boot-stable-v98',
      'presence-lite.js?v=20260909-presence-stable-v103',
      'safe-core.js?v=20260908-boot-stable-v98',
      'sacola-peso-quantidade.js?v=20260908-boot-stable-v98',
      'material-manager.js?v=20260908-boot-stable-v98',
      'cost-safe.js?v=20260908-boot-stable-v98',
      'cost-unit-stable.js?v=20260908-boot-stable-v98',
      'cost-explanations.js?v=20260908-boot-stable-v98',
      'formula-unlock.js?v=20260908-boot-stable-v98',
      'help-extra.js?v=20260908-boot-stable-v98',
      'back-extra.js?v=20260908-boot-stable-v98',
      'bobina-safe.js?v=20260908-bobina-raio-preciso-v104',
      'bobina-factor-profiles.js?v=20260908-bobina-fatores-v1',
      'contact-extra.js?v=20260908-boot-stable-v98',
      'update-notify-policy.js?v=20260908-boot-stable-v98',
      'pwa-update.js?v=20260908-boot-stable-v98',
      'install-app.js?v=20260908-boot-stable-v98',
      'vendedor-extra.js?v=20260908-boot-stable-v98',
      'system-extra.js?v=20260908-boot-stable-v98',
      'offline-mode.js?v=20260908-boot-stable-v98',
      'formula-mix-kg.js?v=20260909-op-uma-folha-v1',
      'op-page-maximize.js?v=20260909-op-sem-rodape-v3',
      'op-single-safe.js?v=20260908-op-a4-ios-onepage-v110',
      'formula-share-safe.js?v=20260908-boot-stable-v98',
      'pdf-button-safe.js?v=20260908-boot-stable-v98',
      'formula-view-safe.js?v=20260908-boot-stable-v98',
      'whatsapp-user-number.js?v=20260908-boot-stable-v98',
      'vendedor-pdf-profissional.js?v=20260908-boot-stable-v98',
      'cloud-backup-auto.js?v=20260908-boot-stable-v98',
      'backup-status-fix.js?v=20260908-boot-stable-v98',
      'feedback-extra.js?v=20260908-boot-stable-v98',
      'nav-separation-fix.js?v=20260908-boot-stable-v98',
      'quick-access.js?v=20260908-boot-stable-v98',
      'favoritos.js?v=20260908-boot-stable-v98',
      'home-swap-menu.js?v=20260909-home-swap-v4',
      'course-lock.js?v=20260908-boot-stable-v98',
      'formula-bottom-order.js?v=20260908-boot-stable-v98',
      'machine-recipe.js?v=20260908-boot-stable-v98',
      'extrusao-tabs.js?v=20260908-section-mode-v8',
      'mobile-back-position.js?v=20260909-mobile-back-v5',
      'extrusao-back-tab.js?v=20260909-extrusao-voltar-v2',
      'extrusao-medidas-auto.js?v=20260909-medidas-auto-v1'
    ];

    const tags=scripts.map(s=>'<scr'+'ipt src="./'+s+'"></scr'+'ipt>').join('');
    const ready='<scr'+'ipt>(function(){var fired=false;function finish(){if(fired)return;fired=true;try{window.dispatchEvent(new CustomEvent("df-ui-ready"))}catch(e){}}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",finish,{once:true});else finish();setTimeout(finish,900)})();</scr'+'ipt>';
    h=h.replace('</body>',tags+ready+'</body>');

    document.open();
    document.write(h);
    document.close();
  }catch(e){
    document.body.style.visibility='visible';
    document.body.style.opacity='1';
    document.body.style.background='#080b13';
    document.body.innerHTML='<div style="max-width:520px;margin:80px auto;padding:24px;text-align:center"><h2>DF EXTRUSOR PRO</h2><p>Não foi possível carregar a calculadora.</p><p style="color:#94a3b8">Verifique sua internet e tente novamente.</p><button onclick="location.reload()" style="margin-top:16px;border:1px solid #f5a000;background:#241600;color:#ffd36a;border-radius:12px;padding:13px 18px;font-weight:900">TENTAR NOVAMENTE</button></div>';
  }
})();
</script>
</body>
</html>
