<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b13">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>DF EXTRUSOR PRO</title>
</head>
<body style="margin:0;background:#080b13;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial">
<script>
(async()=>{
  try{
    const r=await fetch('./app.html?v=20260904-formulacao-v4',{cache:'no-store'});
    if(!r.ok) throw new Error('Falha ao carregar aplicativo');
    let h=await r.text();
    const patch=`<script>(function(){
      var FO_ROWS=[];
      function q(id){return document.getElementById(id)}
      function esc(t){return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
      function safeLower(t){return String(t||'').trim().toLocaleLowerCase('pt-BR')}
      function pn(v){if(window.parseNum)return parseNum(v);var s=String(v||'').trim().replace(/\\s/g,'');if(!s)return 0;if(s.indexOf(',')>-1&&s.indexOf('.')>-1)s=s.replace(/\\./g,'').replace(',','.');else s=s.replace(',','.');var n=parseFloat(s);return Number.isFinite(n)?n:0}
      function fm(v,d){if(window.fmt)return fmt(v,d);return Number.isFinite(v)?v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}):'—'}
      function cash(v){if(window.rs)return rs(v);return 'R$ '+fm(v,2)}
      function st(id,t){if(window.set)set(id,t);else{var e=q(id);if(e)e.textContent=t}}
      function mats(){return window.loadMats?loadMats():[]}
      function forms(){return window.loadForms?loadForms():[]}
      window.renderMatBatch=function(){
        var b=q('matBatch');
        if(!b)return;
        var card=b.closest('.card');
        if(card){
          var h2=card.querySelector('h2');
          var hint=card.querySelector('.hint');
          if(h2)h2.textContent='1. Cadastrar material';
          if(hint)hint.textContent='Cadastre um material por vez. O preço por kg é opcional. Ao cadastrar, a linha limpa e fica pronta para o próximo material.';
        }
        b.innerHTML='<div class="formRow"><div class="rowTitle">Novo material</div><div class="grid"><div><label>Nome do material</label><input id="matNome1" placeholder="Ex.: Canela"></div><div><label>Preço por kg opcional</label><input id="matPreco1" inputmode="decimal" placeholder="Ex.: 5,50"></div></div></div>';
        var btn=q('matSave'); if(btn)btn.textContent='CADASTRAR MATERIAL';
        var clear=q('matClearBatch'); if(clear)clear.style.display='none';
      };
      window.renderMatSaved=function(){
        var b=q('matSaved');
        if(!b)return;
        var card=b.closest('.card');
        if(card)card.style.display='none';
      };
      window.salvarMateriais=function(){
        var nomeEl=q('matNome1'),precoEl=q('matPreco1');
        var nome=(nomeEl&&nomeEl.value||'').trim();
        var preco=pn(precoEl&&precoEl.value||'');
        if(!nome){alert('Digite o nome do material.');if(nomeEl)nomeEl.focus();return}
        var lista=mats();
        if(lista.some(function(m){return safeLower(m.nome)===safeLower(nome)})){alert('Esse material já está cadastrado. Não pode cadastrar duas vezes com o mesmo nome.');if(nomeEl)nomeEl.focus();return}
        lista.push({id:Date.now()+Math.floor(Math.random()*999),nome:nome,preco:preco});
        if(window.saveMats)saveMats(lista);
        if(nomeEl)nomeEl.value='';
        if(precoEl)precoEl.value='';
        if(nomeEl)nomeEl.focus();
        alert('Material cadastrado. Campo liberado para o próximo material.');
      };
      function buildOptions(selected){
        var lista=mats();
        var html='<option value="">Selecione o material</option>';
        if(!lista.length)html='<option value="">Cadastre material primeiro</option>';
        for(var i=0;i<lista.length;i++){
          var m=lista[i],sel=String(selected||'')===String(m.id)?' selected':'';
          html+='<option value="'+esc(m.id)+'"'+sel+'>'+esc(m.nome)+(m.preco>0?' — '+cash(m.preco)+'/kg':'')+'</option>';
        }
        return html;
      }
      function materialById(id){return mats().find(function(m){return String(m.id)===String(id)})}
      function addRow(){
        var sel=q('foAddMat'),pctEl=q('foAddPct');
        var id=sel&&sel.value||'';
        var pct=pn(pctEl&&pctEl.value||'');
        if(!id){alert('Escolha um material.');return}
        if(!(pct>0)){alert('Digite a porcentagem do material.');if(pctEl)pctEl.focus();return}
        if(FO_ROWS.some(function(r){return String(r.id)===String(id)})){alert('Esse material já foi colocado na formulação.');return}
        if(FO_ROWS.length>=8){alert('Limite de 8 materiais nesta formulação.');return}
        var m=materialById(id);
        FO_ROWS.push({id:id,nome:m?m.nome:'',preco:m?+m.preco||0:0,pct:pct});
        if(sel)sel.value='';
        if(pctEl)pctEl.value='';
        renderMixList();
        window.calcFo&&calcFo();
      }
      function renderMixList(){
        var b=q('foMixList');
        if(!b)return;
        var total=pn(q('foTotal')&&q('foTotal').value||'');
        if(!FO_ROWS.length){b.innerHTML='<div class="formNote">Nenhum material adicionado na formulação ainda.</div>';return}
        var html='';
        for(var i=0;i<FO_ROWS.length;i++){
          var r=FO_ROWS[i],m=materialById(r.id)||r;
          r.nome=m.nome||r.nome||'';r.preco=+m.preco||+r.preco||0;
          var kg=total*(+r.pct||0)/100;
          var custo=r.preco>0?kg*r.preco:0;
          html+='<div class="savedItem"><b>'+esc(r.nome)+'</b><div class="formNote">'+fm(+r.pct||0,2)+'%'+(total?' = '+fm(kg,3)+' kg':'')+(custo?' • '+cash(custo):'')+'</div><div class="savedBtns"><button class="delBtn" type="button" data-remrow="'+i+'">REMOVER</button></div></div>';
        }
        b.innerHTML=html;
      }
      window.renderMixRows=function(savedRows){
        FO_ROWS=(savedRows||[]).map(function(r){var m=materialById(r.id)||r;return {id:String(r.id||''),nome:m.nome||r.nome||'',preco:+m.preco||+r.preco||0,pct:+r.pct||0}}).filter(function(r){return r.id&&r.pct>0});
        var b=q('foMixRows');
        if(!b)return;
        var card=b.closest('.card');
        if(card){
          var h2=card.querySelector('h2');
          var note=card.querySelector('.formNote');
          if(h2)h2.textContent='2. Montar formulação';
          if(note)note.textContent='Escolha um material por vez, coloque a porcentagem e clique em adicionar. Não deixa repetir material.';
        }
        b.innerHTML='<div class="formRow"><div class="rowTitle">Adicionar na formulação</div><div class="grid"><div><label>Material</label><select id="foAddMat">'+buildOptions('')+'</select></div><div><label>Porcentagem %</label><input id="foAddPct" inputmode="decimal" placeholder="Ex.: 60"></div></div><button id="foAddRow" class="calcBtn" type="button">ADICIONAR NA FORMULAÇÃO</button></div><div id="foMixList"></div>';
        var btn=q('foAddRow');if(btn)btn.addEventListener('click',addRow);
        var pct=q('foAddPct');if(pct)pct.addEventListener('keydown',function(e){if(e.key==='Enter')addRow()});
        var list=q('foMixList');if(list)list.addEventListener('click',function(ev){var i=ev.target&&ev.target.dataset?ev.target.dataset.remrow:null;if(i!==undefined&&i!==null){FO_ROWS.splice(+i,1);renderMixList();window.calcFo&&calcFo()}});
        renderMixList();
        window.calcFo&&calcFo();
      };
      window.getFoRows=function(){return FO_ROWS.slice()};
      window.calcFo=function(){
        var total=pn(q('foTotal')&&q('foTotal').value||'');
        var pct=0,kg=0,custo=0;
        for(var i=0;i<FO_ROWS.length;i++){
          var r=FO_ROWS[i],m=materialById(r.id)||r;
          r.nome=m.nome||r.nome||'';r.preco=+m.preco||+r.preco||0;
          pct+=+r.pct||0;
          var k=total*(+r.pct||0)/100;
          kg+=k;
          if(r.preco>0)custo+=k*r.preco;
        }
        renderMixList();
        st('foTotPct',pct?fm(pct,2)+'%':'—');
        st('foTotKg',kg?fm(kg,3)+' kg':'—');
        st('foCustoTotal',custo?cash(custo):'—');
        st('foCustoKg',custo&&total?cash(custo/total)+'/kg':'—');
        var status=q('foStatus');
        if(status){
          var d=100-pct;
          if(Math.abs(d)<=0.05&&pct>0){status.textContent='FORMULAÇÃO FECHADA 100% ✅';status.className='midRes ok'}
          else if(d>0){status.textContent='FALTAM '+fm(d,2)+'% PARA FECHAR ⚠️';status.className='midRes warn'}
          else{status.textContent='PASSOU '+fm(Math.abs(d),2)+'% DO LIMITE ❌';status.className='midRes bad'}
        }
      };
      window.salvarFormula=function(){
        var nome=(q('foNome')&&q('foNome').value||'').trim()||'Formulação';
        var total=pn(q('foTotal')&&q('foTotal').value||'');
        var rows=FO_ROWS.filter(function(r){return r.id&&r.pct>0});
        var pct=rows.reduce(function(s,r){return s+(+r.pct||0)},0);
        if(!total){alert('Digite quantos kg quer fazer.');return}
        if(!rows.length){alert('Adicione pelo menos 1 material na formulação.');return}
        if(Math.abs(100-pct)>0.05&&!confirm('A formulação não fechou 100%. Salvar mesmo assim?'))return;
        var custo=rows.reduce(function(s,r){return s+(total*(+r.pct||0)/100)*(+r.preco||0)},0);
        var rec={id:Date.now(),nome:nome,total:total,rows:rows.map(function(r){return {id:r.id,nome:r.nome,preco:+r.preco||0,pct:+r.pct||0}}),custo:custo,custoKg:custo&&total?custo/total:0,criado:new Date().toISOString()};
        var a=forms();a.unshift(rec);if(window.saveForms)saveForms(a);alert('Formulação salva.');
      };
      window.abrirFormula=function(f,dup){
        if(!f)return;
        if(q('foNome'))q('foNome').value=dup?(f.nome+' cópia'):f.nome;
        if(q('foTotal'))q('foTotal').value=String(f.total||'').replace('.',',');
        renderMixRows(f.rows||[]);
        if(window.show)show('fo');
      };
      window.initFormula=function(){
        renderMatBatch();renderMatSaved();renderMixRows();if(window.renderForms)renderForms();if(window.refreshFormulaLock)refreshFormulaLock();
        var ms=q('matSave');if(ms)ms.onclick=salvarMateriais;
        var ft=q('foTotal');if(ft)ft.oninput=calcFo;
        var fs=q('foSave');if(fs)fs.onclick=salvarFormula;
        var saved=q('foSaved');if(saved){saved.onclick=function(ev){var id=(ev.target.dataset.openform||ev.target.dataset.dupform||ev.target.dataset.delform||'');if(!id)return;var lista=forms(),f=lista.find(function(x){return String(x.id)===String(id)});if(ev.target.dataset.delform){if(confirm('Excluir esta formulação?')&&window.saveForms)saveForms(lista.filter(function(x){return String(x.id)!==String(id)}));return}if(ev.target.dataset.dupform){var cp=JSON.parse(JSON.stringify(f));cp.id=Date.now();cp.nome=(cp.nome||'Formulação')+' cópia';cp.criado=new Date().toISOString();lista.unshift(cp);if(window.saveForms)saveForms(lista);return}abrirFormula(f,false)}}
      };
    })();<\/script>`;
    h=h.replace('</body>',patch+'</body>');
    document.open();
    document.write(h);
    document.close();
  }catch(e){
    document.body.innerHTML='<div style="max-width:520px;margin:80px auto;padding:24px;text-align:center"><h2>DF EXTRUSOR PRO</h2><p>Não foi possível carregar a calculadora. Atualize e tente novamente.</p></div>';
  }
})();
</script>
</body>
</html>
