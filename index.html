nput id="densManual" type="number" inputmode="decimal" step="0.001" placeholder="Ex.: 0,915"></div><div class="hint">Para reciclado, escolha “Digitar manualmente”.</div></div></div><div class="result"><div id="gmIdeal" class="big">0,00 g/m</div><div class="small">peso ideal de 1 metro do filme</div></div></div><div class="card"><div class="title">Descobrir a micra pelo peso de 1 metro</div><div class="grid"><div><label>Peso medido de 1 metro (g)</label><input id="pesoMedido" type="number" inputmode="decimal" step="0.01" placeholder="Ex.: 25,0"></div><div><label>Largura do filme fechado (cm)</label><input id="largura2" type="number" inputmode="decimal" step="0.01" placeholder="Ex.: 100"></div><div><label>Densidade do material</label><select id="densidade2"><option value="0.922" selected>0,922 — PE referência</option><option value="0.920">0,920</option><option value="0.925">0,925</option><option value="0.930">0,930</option><option value="0.940">0,940</option><option value="0.950">0,950</option><option value="manual">Digitar manualmente</option></select><div id="manualBox2" class="manual"><label>Densidade manual (g/cm³)</label><input id="densManual2" type="number" inputmode="decimal" step="0.001" placeholder="Ex.: 0,915"></div></div></div><div class="result"><div id="micraReal" class="big">0,00 µm</div><div class="small">micra real — parede dupla</div><div id="comparacao" class="status"></div></div></div><div class="foot">DF • Calculadora de Extrusão</div></div><script>const $=id=>document.getElementById(id);const br=n=>Number.isFinite(n)?n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):'0,00';function den(s,m){let v=$(s).value;return v==='manual'?(parseFloat($(m).value)||0):(parseFloat(v)||0)}function tog(s,b){$(b).style.display=$(s).value==='manual'?'block':'none'}function ideal(){let l=parseFloat($('largura').value)||0,m=parseFloat($('micra').value)||0,d=den('densidade','densManual');$('gmIdeal').textContent=br(l*m*d*.01)+' g/m';comp()}function real(){let p=parseFloat($('pesoMedido').value)||0,l=parseFloat($('largura2').value)||0,d=den('densidade2','densManual2'),m=l>0&&d>0?p/(l*d*.01):0;$('micraReal').textContent=br(m)+' µm';comp(m)}function comp(m){let a=parseFloat($('micra').value)||0,p=parseFloat($('pesoMedido').value)||0,l=parseFloat($('largura2').value)||0,d=den('densidade2','densManual2');let r=m??(p>0&&l>0&&d>0?p/(l*d*.01):0),c=$('comparacao');if(!(a>0&&r>0)){c.textContent='';c.className='status';return}let x=(r-a)/a*100;if(Math.abs(x)<=2){c.textContent='No alvo • diferença '+br(x)+'%';c.className='status ok'}else if(x>0){c.textContent='Filme mais grosso • +'+br(x)+'%';c.className='status warn'}else{c.textContent='Filme mais fino • '+br(x)+'%';c.className='status bad'}}['largura','micra','densManual'].forEach(i=>$(i).addEventListener('input',ideal));['pesoMedido','largura2','densManual2'].forEach(i=>$(i).addEventListener('input',real));$('densidade').addEventListener('change',()=>{tog('densidade','manualBox');ideal()});$('densidade2').addEventListener('change',()=>{tog('densidade2','manualBox2');real()});$('largura').addEventListener('input',()=>{if(!$('largura2').dataset.e)$('largura2').value=$('largura').value;real()});$('largura2').addEventListener('input',()=>{$('largura2').dataset.e='1'});ideal();real();</script></body></html>
