<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>DF - Calculadora de Extrusão</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:20px 14px 36px}.brand{text-align:center;margin:8px 0 18px}.brand h1{margin:0;font-size:24px}.brand p{margin:6px 0;color:#94a3b8}.badge{display:inline-block;background:#052e16;color:#86efac;border:1px solid #166534;padding:4px 8px;border-radius:999px;font-size:12px}.card{background:#111827;border:1px solid #263244;border-radius:18px;padding:16px;margin-bottom:14px}.title{font-size:17px;font-weight:800;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.grid{grid-template-columns:1fr}}label{display:block;font-size:13px;color:#cbd5e1;margin:0 0 6px}input,select{width:100%;border:1px solid #334155;background:#0f172a;color:#f8fafc;border-radius:12px;padding:13px 12px;font-size:17px;outline:none}input:focus,select:focus{border-color:#22c55e}.hint{font-size:12px;color:#94a3b8;margin-top:6px}.result{margin-top:14px;border:1px solid #274734;background:#0c1c13;border-radius:15px;padding:15px;text-align:center}.big{font-size:34px;font-weight:900;color:#86efac}.small{color:#bbf7d0;margin-top:5px;font-size:14px}.status{margin-top:10px;font-weight:700;font-size:15px}.ok{color:#86efac}.warn{color:#fbbf24}.bad{color:#fca5a5}.manual{display:none;margin-top:10px}.foot{text-align:center;color:#64748b;font-size:12px;margin-top:14px}</style></head><body><div class="wrap"><div class="brand"><h1>DF • Calculadora de Extrusão</h1><p>Filme tubular • micra em parede dupla</p><span class="badge">Uso exclusivo DF</span></div><div class="card"><div class="title">Peso ideal por metro</div><div class="grid"><div><label>Largura do filme fechado (cm)</label><input id="largura" type="number" inputmode="decimal" step="0.01" placeholder="Ex.: 100"></div><div><label>Micra desejada — parede dupla (µm)</label><input id="micra" type="number" inputmode="decimal" step="0.001" placeholder="Ex.: 27"></div><div><label>Densidade do material</label><select id="densidade"><option value="0.922" selected>0,922 — PE referência</option><option value="0.920">0,920</option><option value="0.925">0,925</option><option value="0.930">0,930</option><option value="0.940">0,940</option><option value="0.950">0,950</option><option value="manual">Digitar manualmente</option></select><div id="manualBox" class="manual"><label>Densidade manual (g/cm³)</label><input id="densManual" type="number" inputmode="decimal" step="0.001" placeholder="Ex.: 0,915"></div><div class="hint">Para reciclado, escolha “Digitar manualmente”.</div></div></div><div class="result"><div id="gmIdeal" class="big">0,00 g/m</div><div class="small">peso ideal de 1 metro do filme</div></div></div><div class="card"><div class="title">Descobrir a micra pelo peso de 1 metro</div><div class="grid"><div><label>Peso medido de 1 metro (g)</label><input id="pesoMedido" type="number" inputmode="decimal" step="0.01" placeholder="Ex.: 25,0"></div><div><label>Largura do filme fechado (cm)</label><input id="largura2" type="number" inputmode="decimal" step="0.01" placeholder="Ex.: 100"></div><div><label>Densidade do material</label><select id="densidade2"><option value="0.922" selected>0,922 — PE referência</option><option value="0.920">0,920</option><option value="0.925">0,925</option><option value="0.930">0,930</option><option value="0.940">0,940</option><option value="0.950">0,950</option><option value="manual">Digitar manualmente</option></select><div id="manualBox2" class="manual"><label>Densidade manual (g/cm³)</label><input id="densManual2" type="number" inputmode="decimal" step="0.001" placeholder="Ex.: 0,915"></div></div></div><div class="result"><div id="micraReal" class="big">0,00 µm</div><div class="small">micra real — parede dupla</div><div id="comparacao" class="status"></div></div></div><div class="foot">DF • Calculadora de Extrusão</div></div><script>const $=id=>document.getElementById(id);const br=n=>Number.isFinite(n)?n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}):'0,00';function den(s,m){let v=$(s).value;return v==='manual'?(parseFloat($(m).value)||0):(parseFloat(v)||0)}function tog(s,b){$(b).style.display=$(s).value==='manual'?'block':'none'}function ideal(){let l=parseFloat($('largura').value)||0,m=parseFloat($('micra').value)||0,d=den('densidade','densManual');$('gmIdeal').textContent=br(l*m*d*.01)+' g/m';comp()}function real(){let p=parseFloat($('pesoMedido').value)||0,l=parseFloat($('largura2').value)||0,d=den('densidade2','densManual2'),m=l>0&&d>0?p/(l*d*.01):0;$('micraReal').textContent=br(m)+' µm';comp(m)}function comp(m){let a=parseFloat($('micra').value)||0,p=parseFloat($('pesoMedido').value)||0,l=parseFloat($('largura2').value)||0,d=den('densidade2','densManual2');let r=m??(p>0&&l>0&&d>0?p/(l*d*.01):0),c=$('comparacao');if(!(a>0&&r>0)){c.textContent='';c.className='status';return}let x=(r-a)/a*100;if(Math.abs(x)<=2){c.textContent='No alvo • diferença '+br(x)+'%';c.className='status ok'}else if(x>0){c.textContent='Filme mais grosso • +'+br(x)+'%';c.className='status warn'}else{c.textContent='Filme mais fino • '+br(x)+'%';c.className='status bad'}}['largura','micra','densManual'].forEach(i=>$(i).addEventListener('input',ideal));['pesoMedido','largura2','densManual2'].forEach(i=>$(i).addEventListener('input',real));$('densidade').addEventListener('change',()=>{tog('densidade','manualBox');ideal()});$('densidade2').addEventListener('change',()=>{tog('densidade2','manualBox2');real()});$('largura').addEventListener('input',()=>{if(!$('largura2').dataset.e)$('largura2').value=$('largura').value;real()});$('largura2').addEventListener('input',()=>{$('largura2').dataset.e='1'});ideal();real();</script></body></html>
