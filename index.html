-top:13px;border:1px solid #334155;background:#0f172a;border-radius:13px;padding:14px}.coursePay b{color:#86efac}.courseNote{color:#94a3b8;font-size:12px;line-height:1.45;margin-top:8px}</style>';h=h.replace('</head>',extraCss+'</head>');const oldCost='<button id="btCu" class="tab" onclick="show(\'cu\')">CUSTO</button>';const courseBtn='<button id="btCo" class="tab" onclick="showCourse()">CURSO</button>';h=h.replace(oldCost,oldCost+courseBtn);const coursePage='<section id="pgCo" class="page"><div class="card"><div class="courseHero"><span class="tag">CURSO PROFISSIONAL</span><h2>Extrusão de Filmes Plásticos</h2><p>Treinamento profissional voltado ao processo de extrusão, regulagem, qualidade do filme e solução de problemas de produção.</p></div></div><div class="card"><h2>Conteúdo do curso</h2><div class="courseList"><div class="courseItem"><div class="courseNum">1</div><div><b>Fundamentos da extrusão</b><small>Processo, componentes da extrusora e funcionamento da linha.</small></div></div><div class="courseItem"><div class="courseNum">2</div><div><b>Matérias-primas e densidade</b><small>Alta, baixa, linear, material reciclado e influência no processo.</small></div></div><div class="courseItem"><div class="courseNum">3</div><div><b>Temperatura, pressão e produtividade</b><small>Como regular o processo e identificar variações.</small></div></div><div class="courseItem"><div class="courseNum">4</div><div><b>Matriz, balão e estabilidade do filme</b><small>Ajustes de matriz, ar, largura e estabilidade do balão.</small></div></div><div class="courseItem"><div class="courseNum">5</div><div><b>Micra, peso por metro e controle de qualidade</b><small>Como medir, calcular e manter o filme dentro do padrão.</small></div></div><div class="courseItem"><div class="courseNum">6</div><div><b>Defeitos e correções</b><small>Furos, gel, barriga, variação de micra, solda e outros problemas.</small></div></div><div class="courseItem"><div class="courseNum">7</div><div><b>Operação e segu
