<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b13">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>DF EXTRUSOR PRO — TESTE OP PRODUÇÃO</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080b13;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}.w{max-width:760px;margin:auto;padding:18px 14px 50px}.brand{text-align:center;background:#000;border:1px solid #20242a;border-radius:24px;padding:20px 14px;margin:8px 0 16px}.tag{display:inline-block;background:#2a1900;color:#ffd36a;border:1px solid #f59e0b;padding:7px 12px;border-radius:999px;font-size:11px;font-weight:950}.brand h1{font-size:28px;margin:12px 0 5px}.brand p{margin:0;color:#94a3b8;font-size:13px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:14px 0;padding:6px;background:#08090b;border:1px solid #1d2228;border-radius:18px}.tab{border:1px solid #334155;background:#111827;color:#cbd5e1;border-radius:12px;padding:12px 4px;font-size:11px;font-weight:900}.card{background:#111827;border:1px solid #263244;border-radius:18px;padding:16px;margin-top:14px;color:#cbd5e1}.status{position:fixed;z-index:2147483647;top:max(7px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#2a1900;color:#ffd36a;border:1px solid #f59e0b;border-radius:999px;padding:6px 10px;font:900 10px system-ui;white-space:nowrap}.err{display:none;background:#230b0b;border:1px solid #7f1d1d;color:#fecaca;border-radius:14px;padding:14px;margin-top:14px}.retry{border:1px solid #f59e0b;background:#241600;color:#ffd36a;border-radius:12px;padding:12px 16px;font-weight:900;width:100%;margin-top:10px}
</style>
</head>
<body>
<div class="status">VERSÃO TESTE • OP PRODUÇÃO</div>
<div class="w">
  <div class="brand"><span class="tag">DF EXTRUSOR PRO • TESTE</span><h1>Produção</h1><p>OP semanal — Picote • Sacoleira • Blocadora</p></div>
  <div class="tabs">
    <button class="tab" type="button">PICOTE</button>
    <button class="tab" type="button">SACOLEIRA</button>
    <button class="tab" type="button">BLOCADORA</button>
  </div>
  <div class="card">A versão de teste vai abrir o módulo de Produção abaixo. O aplicativo oficial não foi alterado.</div>
  <div id="err" class="err"><b>Não foi possível abrir o módulo.</b><div style="margin-top:5px">Toque em tentar novamente.</div><button class="retry" onclick="location.reload()">TENTAR NOVAMENTE</button></div>
</div>
<script src="./teste/producao-op-setores-v3.js?v=20261003-preview-direct-v2"></script>
<script>
(function(){
  function start(){
    try{window.dispatchEvent(new CustomEvent('df-ui-ready'))}catch(e){}
    var n=0,t=setInterval(function(){
      var b=document.getElementById('dfProdOpen')||document.getElementById('btPr')||document.querySelector('[data-df-producao-open]');
      if(b){clearInterval(t);try{b.click()}catch(e){};return}
      if(++n>30){clearInterval(t);document.getElementById('err').style.display='block'}
    },200);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>
</body>
</html>
