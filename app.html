<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b13">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>DF EXTRUSOR PRO</title>
</head>
<body style="margin:0;background:#080b13;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial">
<script>
(async()=>{
  try{
    const r=await fetch('https://raw.githubusercontent.com/reckcp9-code/calculadora-extrusao/3e570fc08be61679377cd81eb4e90bc45216f4c2/app.html',{cache:'no-store'});
    if(!r.ok) throw new Error('Falha ao carregar aplicativo');
    let h=await r.text();

    function getExtrusaoOP(){
      const largura=typeof n==='function'?n('exL'):0;
      const micra=typeof n==='function'?n('exM'):0;
      const grama=typeof pesoMetroIdeal==='function'?pesoMetroIdeal():0;
      return {largura:largura||0,micra:micra||0,grama:grama||0};
    }

    function salvarFormula(){
      const nome=($("foNome")?.value||"").trim()||"Formulação",total=n("foTotal"),rows=getFoRows().filter(r=>r.id&&r.pct>0);
      const pct=rows.reduce((s,r)=>s+r.pct,0);
      if(!total){alert("Digite quantos kg quer fazer.");return}
      if(!rows.length){alert("Escolha pelo menos 1 material.");return}
      if(Math.abs(100-pct)>0.05&&!confirm("A formulação não fechou 100%. Salvar mesmo assim?"))return;
      const custo=rows.reduce((s,r)=>s+(total*r.pct/100)*(r.preco||0),0);
      const rec={id:Date.now(),nome,total,rows,custo,custoKg:custo&&total?custo/total:0,op:getExtrusaoOP(),criado:new Date().toISOString()};
      const a=loadForms();a.unshift(rec);saveForms(a);alert("Formulação salva.")
    }

    function printFormulaPdf(f){
      if(!f){alert("Formulação não encontrada.");return}
      const total=Number(f.total)||0,rows=f.rows||[];
      let pct=0,custoTotal=0,trs="";
      rows.forEach(r=>{
        const mat=materialById(r.id)||r,nome=mat.nome||r.nome||"",preco=Number(r.preco||mat.preco)||0,p=Number(r.pct)||0,kg=total*p/100,custo=preco>0?kg*preco:0;
        pct+=p;custoTotal+=custo;
        trs+='<tr><td>'+esc(nome)+'</td><td>'+fmt(p,2)+'%</td><td>'+fmt(kg,3)+' kg</td><td>'+rs(preco)+'</td><td>'+rs(custo)+'</td></tr>';
      });
      if(!trs)trs='<tr><td colspan="5">Sem materiais nesta formulação.</td></tr>';
      const custoKg=custoTotal&&total?custoTotal/total:0,hoje=new Date().toLocaleString("pt-BR");
      const html='<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Formulação '+esc(f.nome||"")+'</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#111;margin:28px}h1{margin:0 0 4px;font-size:26px}h2{margin:24px 0 10px;font-size:18px}.sub{color:#555;margin-bottom:18px}.top{border-bottom:3px solid #111;padding-bottom:12px;margin-bottom:18px}.box{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.kpi{border:1px solid #ddd;border-radius:10px;padding:10px}.kpi span{display:block;color:#555;font-size:12px}.kpi b{font-size:17px}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border:1px solid #ccc;padding:10px;text-align:left;font-size:13px}th{background:#eee}.foot{margin-top:26px;color:#666;font-size:12px}@media print{button{display:none}body{margin:18px}.box{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="top"><h1>DF Manutenção e Consultoria</h1><div class="sub">Relatório de Formulação</div></div><h2>'+esc(f.nome||"Formulação")+'</h2><div class="box"><div class="kpi"><span>Quantidade total</span><b>'+fmt(total,3)+' kg</b></div><div class="kpi"><span>Total da porcentagem</span><b>'+fmt(pct,2)+'%</b></div><div class="kpi"><span>Custo total</span><b>'+rs(custoTotal)+'</b></div><div class="kpi"><span>Custo por kg final</span><b>'+rs(custoKg)+'</b></div></div><table><thead><tr><th>Material</th><th>%</th><th>Kg</th><th>Valor/kg</th><th>Custo</th></tr></thead><tbody>'+trs+'</tbody></table><div class="foot">Gerado em '+esc(hoje)+' • DF EXTRUSOR PRO</div><script>setTimeout(function(){window.focus();window.print()},450)<\/script></body></html>';
      const w=window.open("","_blank");
      if(!w){alert("O navegador bloqueou a janela do PDF. Libere pop-up e tente de novo.");return}
      w.document.open();w.document.write(html);w.document.close();
    }

    function printFormulaOp(f){
      if(!f){alert("Formulação não encontrada.");return}
      const nome=f.nome||"Formulação",total=Number(f.total)||0,rows=f.rows||[];
      const atual=typeof getExtrusaoOP==='function'?getExtrusaoOP():{largura:0,micra:0,grama:0};
      const op=f.op||{};
      const largura=Number(op.largura||atual.largura)||0;
      const micra=Number(op.micra||atual.micra)||0;
      const grama=Number(op.grama||atual.grama)||0;
      const hoje=new Date().toLocaleDateString("pt-BR");
      const dupla=micra?fmt(micra/100,2)+"mc":"_____";
      const parede=micra?fmt(micra/200,2)+"mc":"_____";
      const gram=grama?fmt(grama,1)+" gramas por mt":"_____";
      const lb=largura?fmt(largura,1).replace(',0','')+" CM":"_____ CM";
      const letras=['A','B','C','D','E','F','G','H'];
      let matRows='';
      for(let i=0;i<8;i++){
        const r=rows[i]||{},mat=r.id?(materialById(r.id)||r):{},desc=mat.nome||r.nome||'',pct=Number(r.pct)||0;
        matRows+='<tr><td>'+letras[i]+'</td><td>'+esc(desc)+'</td><td>'+(pct?fmt(pct,2)+'%':'')+'</td></tr>';
      }
      let prodRows='';
      for(let i=0;i<8;i++)prodRows+='<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>';
      const html='<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>OP '+esc(nome)+'</title><style>@page{size:A4 landscape;margin:7mm}*{box-sizing:border-box}body{font-family:Arial,sans-serif;color:#111;margin:0;font-size:12px}.op{width:100%;border-collapse:collapse;table-layout:fixed}.op td,.op th{border:1px solid #333;padding:4px 5px;vertical-align:middle}.y{background:#fff200;font-weight:700}.center{text-align:center}.b{font-weight:700}.small{font-size:11px}.top td{height:22px}.mat td{height:22px}.prod td{height:24px}.codes td{font-size:11px}.logo{font-weight:700}.printHint{margin:8px 0;color:#555}@media print{.printHint{display:none}}</style></head><body>'+
      '<div class="printHint">OP pronta para imprimir. Escolha salvar como PDF ou imprimir.</div>'+
      '<table class="op top"><tr><td colspan="5" class="logo">FERREIRA EMBALAGENS</td><td class="b center">OS:</td><td></td><td class="b">Data emissão:</td><td>'+esc(hoje)+'</td></tr>'+
      '<tr><td class="b y">Cliente: '+esc(nome)+'</td><td colspan="2">Cidade/UF:</td><td>UF:</td><td colspan="2" class="b center">FASE 1: EXTRUSÃO</td><td colspan="3" class="b">PREVISÃO ENTREGA:</td></tr>'+
      '<tr><td colspan="3">Tamanho final:</td><td colspan="3">cod de barra</td><td colspan="3"></td></tr>'+
      '<tr><td colspan="3">Peso liquido: '+fmt(total,0)+' KG</td><td colspan="3">Peso bruto (kg): '+fmt(total,0)+' KG</td><td colspan="3">Total (FD):</td></tr></table>'+
      '<table class="op"><tr><td class="b">CP:</td><td colspan="8" class="y">descrição do produto= '+esc(nome)+'</td></tr>'+
      '<tr><td colspan="3">Espessura de extrusão (dupla): '+dupla+'</td><td colspan="3">Espessura por parede: '+parede+'</td><td colspan="3">gramatura= '+gram+'</td></tr>'+
      '<tr><td colspan="3">Largura da bobina= '+lb+'</td><td colspan="3">largura do balão= '+lb+'</td><td colspan="3"></td></tr>'+
      '<tr><td colspan="9" class="y">&nbsp;</td></tr>'+
      '<tr><td colspan="9">Observações: </td></tr></table>'+
      '<table class="op mat"><tr><th style="width:7%">material</th><th>descrição da materia prima</th><th style="width:10%">%</th></tr>'+matRows+'</table>'+
      '<br><table class="op prod"><tr><th>Data</th><th>Operador</th><th>Maquina</th><th>Aparas(kg)</th><th>Quantidade(kg)</th><th>cod parada</th><th>inicio parada</th><th>final de parada</th><th>inicio de produção</th><th>final de produção</th><th>numero de bobinas</th></tr>'+prodRows+'</table>'+
      '<table class="op codes"><tr><td>01- troca de TELA</td><td>02-acerto</td><td>03-M.mecanica</td><td>04-falta de energia</td><td>05-material molhado</td><td>06-teste</td></tr><tr><td>07-M.eletrica</td><td>08-limpeza da borda</td><td>09-troca de tela</td><td>10-outros</td><td colspan="2"></td></tr></table>'+
      '<script>setTimeout(function(){window.focus();window.print()},450)<\/script></body></html>';
      const w=window.open("","_blank");
      if(!w){alert("O navegador bloqueou a janela da OP. Libere pop-up e tente de novo.");return}
      w.document.open();w.document.write(html);w.document.close();
    }

    function renderForms(){
      const b=$("foSaved"),forms=loadForms();
      if(!b)return;
      if(!forms.length){b.innerHTML='<div class="formNote">Nenhuma formulação salva ainda.</div>';return}
      b.innerHTML=forms.map(function(f){
        return '<div class="savedItem"><b>'+esc(f.nome||"Formulação")+'</b><div class="formNote">'+fmt(f.total||0,2)+' kg • '+((f.rows||[]).length)+' materiais • '+(f.custo?rs(f.custo):"sem custo")+'</div><div class="savedBtns" style="grid-template-columns:repeat(5,1fr)"><button class="miniBtn" data-openform="'+f.id+'">ABRIR</button><button class="miniBtn" data-pdfform="'+f.id+'">PDF</button><button class="miniBtn" data-opform="'+f.id+'">OP</button><button class="miniBtn" data-dupform="'+f.id+'">DUPLICAR</button><button class="delBtn" data-delform="'+f.id+'">EXCLUIR</button></div></div>';
      }).join("");
    }

    const extraCode=getExtrusaoOP.toString()+'\n'+printFormulaPdf.toString()+'\n'+printFormulaOp.toString()+'\ndocument.addEventListener("click",function(ev){const ds=ev.target&&ev.target.dataset?ev.target.dataset:{};if(ds.pdfform){ev.preventDefault();ev.stopPropagation();const f=loadForms().find(x=>String(x.id)===String(ds.pdfform));printFormulaPdf(f)}if(ds.opform){ev.preventDefault();ev.stopPropagation();const f=loadForms().find(x=>String(x.id)===String(ds.opform));printFormulaOp(f)}},true);\n';
    h=h.replace(/function salvarFormula\(\)\{[\s\S]*?\}\nfunction renderForms/,salvarFormula.toString()+'\nfunction renderForms');
    h=h.replace(/function renderForms\(\)\{[\s\S]*?\}\nfunction abrirFormula/,renderForms.toString()+'\nfunction abrirFormula');
    h=h.replace('function refreshFormulaLock(){',extraCode+'function refreshFormulaLock(){');

    document.open();
    document.write(h);
    document.close();
  }catch(e){
    document.body.innerHTML='<div style="max-width:520px;margin:80px auto;padding:24px;text-align:center"><h2>DF EXTRUSOR PRO</h2><p>Não foi possível carregar a calculadora. Atualize e tente novamente.</p></div>';
  }
})();
</script>
</body>
</html>
