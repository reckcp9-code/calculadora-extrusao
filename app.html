<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b13">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>DF EXTRUSOR PRO</title>
</head>
<body style="margin:0;background:#080b13;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial">
<script>
(async()=>{
  try{
    const r=await fetch('https://raw.githubusercontent.com/reckcp9-code/calculadora-extrusao/3e570fc08be61679377cd81eb4e90bc45216f4c2/app.html',{cache:'no-store'});
    if(!r.ok) throw new Error('Falha ao carregar aplicativo');
    let h=await r.text();
    h=h.replace('</body>','<script src="./formula-extra.js?v=20260904-op-beauty-v11"></scr'+'ipt><script src="./formula-select.js?v=20260904-select-v12"></scr'+'ipt></body>');
    document.open();
    document.write(h);
    document.close();
  }catch(e){
    document.body.innerHTML='<div style="max-width:520px;margin:80px auto;padding:24px;text-align:center"><h2>DF EXTRUSOR PRO</h2><p>Não foi possível carregar a calculadora. Atualize e tente novamente.</p><p style="color:#fca5a5;font-size:12px">'+String(e&&e.message||e)+'</p></div>';
  }
})();
</script>
</body>
</html>
