<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="DF Manutenção e Consultoria">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="bolt" x1="65" y1="250" x2="540" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe15a"/>
      <stop offset="0.55" stop-color="#f6a300"/>
      <stop offset="1" stop-color="#d86b00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="600" height="600" rx="44" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <text x="300" y="333" text-anchor="middle" fill="#ffffff" font-family="Arial Black, Impact, Arial, sans-serif" font-size="232" font-weight="900" font-style="italic" letter-spacing="-30">DF</text>
    <polygon points="72,306 246,282 240,247 532,291 244,338 250,302" fill="url(#bolt)"/>
    <polygon points="72,306 246,282 240,247 532,291 244,338 250,302" fill="none" stroke="#ffcf33" stroke-width="5" stroke-linejoin="round" opacity="0.85"/>
    <text x="300" y="425" text-anchor="middle" fill="#ffffff" font-family="Arial Black, Arial, sans-serif" font-size="33" font-weight="900" letter-spacing="1.2">MANUTENÇÃO E CONSULTORIA</text>
  </g>
</svg>