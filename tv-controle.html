<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DF PRO | Controle TV</title><style>*{box-sizing:border-box}body{margin:0;background:#080f20;color:#eef5ff;font-family:Arial,sans-serif;padding:3vw}header{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:3px solid #efb72e;padding-bottom:20px}h1{font-size:clamp(25px,3.3vw,52px);margin:0}h1 span{color:#f4ba31}small,.muted{color:#a9b9d1}button{cursor:pointer;border:0;border-radius:10px;background:#1b5ca6;color:white;padding:14px 20px;font-weight:700;font-size:16px}input{width:100%;padding:14px;background:#101e35;color:white;border:1px solid #3a608c;border-radius:9px;font-size:17px}label{display:block;color:#b8c9e1;margin-bottom:6px}.card{background:#101e35;border:2px solid #2868b6;border-radius:17px;padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr));gap:18px;margin-top:25px}.value{font-size:clamp(25px,3vw,48px);font-weight:800;margin:10px 0}.metrics{display:flex;gap:15px;flex-wrap:wrap}.metric{flex:1;min-width:130px;background:#0a1528;padding:15px;border-radius:12px}.banner{padding:15px;margin:20px 0;border-radius:10px;background:#172944;color:#e4eeff}a{color:#9ec7ff}</style></head><body><header><div><h1>DF EXTRUSOR <span>PRO</span></h1><small>LANÇAMENTO MANUAL PARA A TV</small></div><a href="./tv.html">VER TV</a></header><div class="banner" id="status">Carregando valores da TV…</div><div class="card"><label>PIN de administrador</label><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="PIN de 6 números"><p class="muted">Cada linha representa uma máquina. Edite os valores e salve para atualizar a televisão.</p><div id="rows"></div><button type="button" id="import" style="background:#315b8e">IMPORTAR MÁQUINAS CADASTRADAS</button> <button type="button" id="add">+ ADICIONAR MÁQUINA</button> <button type="button" id="save" style="background:#13754b">SALVAR NA TV</button></div><script>const API="https://df-tv-manual-v1.reck-cp9.workers.dev",$=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));function catalog(){try{const c=JSON.parse(localStorage.getItem('df_producao_cadastros_v1')||'{}');return [...new Set(['Picote','Sacoleira','Blocadora'].flatMap(k=>Array.isArray(c?.[k]?.machines)?c[k].machines:[]).map(x=>String(x||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR',{numeric:true}))}catch{return []}}function importMachines(){const existing=[...$('rows').children].map(d=>d.querySelector('.machine').value.trim().toLowerCase());let count=0;for(const name of catalog()){if(!existing.includes(name.toLowerCase())){const blank=[...$('rows').children].find(d=>!d.querySelector('.machine').value.trim());if(blank){blank.querySelector('.machine').value=name}else row({machine:name,production:0,scrap:0});existing.push(name.toLowerCase());count++}}$('status').textContent=count?count+' máquina(s) importada(s) do cadastro. Confira os dados e clique em SALVAR NA TV.':'Nenhuma máquina nova encontrada neste navegador. Abra o controle no mesmo navegador do DF Extrusor Pro para importar os cadastros.'}function row(x={}){let d=document.createElement('div');d.className='card';d.style.margin='15px 0';d.style.borderColor='#3676c4';d.innerHTML='<div class="grid" style="margin:0"><div><label>Máquina</label><input class="machine" placeholder="Ex.: PICOTADEIRA MKB"></div><div><label>Operador</label><input class="operator" placeholder="Nome do operador"></div><div><label>Produção (kg)</label><input class="production" type="number" step="0.01" min="0" inputmode="decimal"></div><div><label>Apara (kg)</label><input class="scrap" type="number" step="0.01" min="0" inputmode="decimal"></div></div><button type="button" class="remove" style="margin-top:12px;background:#713443">REMOVER LINHA</button>';['machine','operator','production','scrap'].forEach(k=>d.querySelector('.'+k).value=x[k]??'');d.querySelector('.remove').onclick=()=>d.remove();$('rows').append(d)}$('add').onclick=()=>row();$('import').onclick=importMachines;async function load(){try{const r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Sem conexão');const d=await r.json();$('rows').innerHTML='';(d.entries||[]).forEach(row);if(!d.entries?.length){row();if(catalog().length)importMachines();}$('status').textContent=d.updatedAt?'Última atualização: '+new Date(d.updatedAt).toLocaleString('pt-BR'):'Nenhum lançamento ainda'}catch(e){$('status').textContent='Não foi possível carregar os dados. Confira a conexão.'}}$('save').onclick=async()=>{const pin=$('pin').value.trim();if(!/^\d{6}$/.test(pin)){alert('Digite o PIN de 6 números');return}const entries=[...$('rows').children].map(d=>({machine:d.querySelector('.machine').value.trim(),operator:d.querySelector('.operator').value.trim(),production:Number(d.querySelector('.production').value),scrap:Number(d.querySelector('.scrap').value)}));if(entries.some(x=>!x.machine||!Number.isFinite(x.production)||x.production<0||!Number.isFinite(x.scrap)||x.scrap<0||x.scrap>x.production)){alert('Confira máquina, produção e apara.');return}if(!confirm('Publicar '+entries.length+' máquina(s) na televisão?'))return;const b=$('save');b.disabled=true;try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin,entries})});const d=await r.json();if(!r.ok)throw Error(d.error||'Falha ao salvar');$('pin').value='';$('status').textContent='Salvo na TV às '+new Date().toLocaleTimeString('pt-BR');alert('Dados enviados para a televisão!')}catch(e){alert('Não foi possível salvar: '+e.message)}finally{b.disabled=false}};load();</script></body></html>
