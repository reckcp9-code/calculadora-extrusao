<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b13">
<title>DF EXTRUSOR PRO — Gerar acesso</title>
</head>
<body style="margin:0;background:#080b13;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial">
<script>
(async()=>{
  try{
    const BASE='https://raw.githubusercontent.com/reckcp9-code/calculadora-extrusao/5dcfb9a96e3d3385db5e75e71cc49e021902a920/gerar-acesso.html';
    const r=await fetch(BASE,{cache:'no-store'});if(!r.ok)throw new Error('Falha ao carregar painel');
    let h=await r.text();
    h=h.replace('grid-template-columns:repeat(5,1fr)','grid-template-columns:repeat(6,1fr)');
    h=h.replace('.pill.paused{color:#fde68a;border-color:#f59e0b;background:#2b1d00}', '.pill.paused{color:#fde68a;border-color:#f59e0b;background:#2b1d00}.pill.expired{color:#fecaca;border-color:#ef4444;background:#450a0a}.daysControl{display:grid;grid-template-columns:minmax(90px,130px) auto;gap:7px;align-items:center;margin-top:10px}.daysControl input{min-width:0;padding:8px 9px;border-radius:8px;font-size:12px}.daysHelp{grid-column:1/-1;font-size:10px;color:#94a3b8}.daysBtn{border-color:#8b5cf6!important;background:#24123f!important;color:#e9d5ff!important}.defaultDaysBox{display:grid;grid-template-columns:minmax(100px,160px) 1fr;gap:8px;align-items:end;margin-top:12px}.defaultDaysBox label{margin:0}.defaultDaysBox input{margin-top:6px}.nameControl{display:grid;grid-template-columns:minmax(140px,1fr) auto;gap:7px;align-items:center;margin-top:10px}.nameControl input{min-width:0;padding:8px 9px;border-radius:8px;font-size:12px}.nameBtn{border-color:#0ea5e9!important;background:#082f49!important;color:#bae6fd!important}@media(max-width:560px){.defaultDaysBox,.nameControl{grid-template-columns:1fr}}');
    h=h.replace('<div class="count"><b id="paused">—</b><span>PAUSADAS</span></div>\n      <div class="count"><b id="revoked">—</b><span>BLOQUEADAS</span></div>','<div class="count"><b id="paused">—</b><span>PAUSADAS</span></div>\n      <div class="count"><b id="expired">—</b><span>VENCIDAS</span></div>\n      <div class="count"><b id="revoked">—</b><span>BLOQUEADAS</span></div>');
    h=h.replace('<div class="card">\n    <h2>Link geral para o grupo</h2>','<div class="card">\n    <h2>Prazo padrão para novos usuários</h2>\n    <div class="sub">Defina uma vez quantos dias todo novo usuário receberá automaticamente quando entrar. Isso não altera usuários já cadastrados.</div>\n    <div class="defaultDaysBox"><label>Dias para novos usuários<input id="defaultDays" type="number" min="0" max="3650" step="1" inputmode="numeric" value="0" placeholder="Ex.: 30"></label><button class="btn alt" id="saveDefaultDaysBtn">SALVAR PRAZO PADRÃO</button></div>\n    <div class="sub" style="margin-top:8px">Use <b>0</b> para novos usuários entrarem sem vencimento automático.</div>\n    <div id="defaultDaysMsg" class="status"></div>\n  </div>\n\n  <div class="card">\n    <h2>Link geral para o grupo</h2>');
    h=h.replace('<h2>Acessos ativos e pausados</h2>\n    <div class="sub">Aqui você pode PAUSAR, REATIVAR, RESETAR APARELHO ou EXCLUIR ACESSO. Excluir devolve a key para LIVRE.</div>','<h2>Acessos e prazo por usuário</h2>\n    <div class="sub">Defina quantos dias cada usuário poderá usar. O prazo começa a contar no momento em que você salvar. Use 0 para deixar sem prazo.</div>');
    h=h.replace("$('free').textContent=j.free??0;$('reserved').textContent=j.reserved??0;$('used').textContent=j.used??0;$('paused').textContent=j.paused??0;$('revoked').textContent=j.revoked??0;","$('free').textContent=j.free??0;$('reserved').textContent=j.reserved??0;$('used').textContent=j.used??0;$('paused').textContent=j.paused??0;$('expired').textContent=j.expired??0;$('revoked').textContent=j.revoked??0;if($('defaultDays')&&document.activeElement!==$('defaultDays'))$('defaultDays').value=String(j.defaultDays??0);");
    h=h.replace("  function shortDevice(v){const s=String(v||'');return s.length>28?s.slice(0,14)+'…'+s.slice(-10):s||'—'}\n\n  async function status",`  function shortDevice(v){const s=String(v||'');return s.length>28?s.slice(0,14)+'…'+s.slice(-10):s||'—'}
  function expiryInfo(it){
    const raw=String(it&&it.expiresAt||'').trim();
    if(!raw)return{expired:false,text:'SEM PRAZO DEFINIDO',cls:'wait'};
    const d=new Date(raw);if(Number.isNaN(d.getTime()))return{expired:false,text:'Prazo inválido',cls:'wait'};
    const ms=d.getTime()-Date.now();
    if(ms<=0)return{expired:true,text:'VENCIDO em '+datePt(raw),cls:'expired'};
    const days=Math.ceil(ms/86400000);
    return{expired:false,text:'Vence em '+datePt(raw)+' • '+days+' dia'+(days===1?'':'s')+' restante'+(days===1?'':'s'),cls:''};
  }
  async function setDays(it,input,btn){
    if(!it||!it.id||!input)return;
    const days=Number(input.value);
    if(!Number.isInteger(days)||days<0||days>3650){alert('Digite um número de dias entre 0 e 3650. Use 0 para deixar sem prazo.');input.focus();return}
    const nome=it.identity||'este usuário';
    const msg=days===0?'Deixar '+nome+' sem prazo de vencimento?':'Definir '+days+' dia(s) de acesso para '+nome+' a partir de agora?';
    if(!confirm(msg))return;
    btn.disabled=true;btn.textContent='SALVANDO...';
    try{const j=await post('/admin/access/set-days',{keyId:it.id,days});await reloadAll('usedMsg',j.message||'Prazo atualizado.')}catch(e){$('usedMsg').textContent=e.message;$('usedMsg').className='status bad';btn.disabled=false;btn.textContent='DEFINIR DIAS'}
  }
  async function setName(it,input,btn){
    if(!it||!it.id||!input)return;
    const name=String(input.value||'').trim().replace(/\\s+/g,' ');
    if(!name){alert('Digite um nome para o usuário.');input.focus();return}
    if(name.length>80){alert('Use no máximo 80 caracteres.');input.focus();return}
    btn.disabled=true;btn.textContent='SALVANDO...';
    try{const j=await post('/admin/access/rename-user',{keyId:it.id,name});await reloadAll('usedMsg',j.message||'Nome atualizado.')}catch(e){$('usedMsg').textContent=e.message;$('usedMsg').className='status bad';btn.disabled=false;btn.textContent='SALVAR NOME'}
  }

  async function status`);
    h=h.replace("+'<br>Ativada: '+esc(datePt(it.usedAt))+'<br>Aparelho: '+esc(shortDevice(it.deviceId))+'</div>","+'<br>Ativada: '+esc(datePt(it.usedAt))+'<br>Prazo: '+esc(expiryInfo(it).text)+'<br>Aparelho: '+esc(shortDevice(it.deviceId))+'</div>");
    const a=h.indexOf('  function renderUsed(){'),b=h.indexOf('  async function loadUsedKeys(){',a);
    if(a<0||b<0)throw new Error('Estrutura do painel incompatível');
    const render=`  function renderUsed(){
    if(!usedItems.length){$('usedList').innerHTML='<div class="empty">Nenhum acesso ativo ou pausado.</div>';return}
    $('usedList').innerHTML=usedItems.map((it,i)=>{
      const paused=String(it.status||'')==='paused',pending=!!it.resetPending,exp=expiryInfo(it);
      const badge=exp.expired?(paused?'PAUSADA • VENCIDA':'VENCIDA'):(paused?'PAUSADA':pending?'AGUARDANDO NOVO APARELHO':'EM USO');
      const cls=exp.expired?'expired':paused?'paused':pending?'wait':'';
      const toggle=exp.expired?'':paused?'<button class="miniBtn resume" data-resume="'+i+'">REATIVAR</button>':'<button class="miniBtn pause" data-pause="'+i+'">PAUSAR</button>';
      const reset=(!paused&&!exp.expired&&it.identity)?'<button class="miniBtn reset" data-reset="'+i+'" '+(pending?'disabled':'')+'>'+(pending?'RESETADO':'RESETAR APARELHO')+'</button>':'';
      const prazo='<div class="daysControl"><input type="number" min="0" max="3650" step="1" inputmode="numeric" placeholder="Dias" data-days-input="'+i+'"><button class="miniBtn daysBtn" data-days-save="'+i+'">DEFINIR DIAS</button><div class="daysHelp">'+esc(exp.text)+' • 0 = sem prazo</div></div>';
      const nome='<div class="nameControl"><input type="text" maxlength="80" value="'+esc(it.identity||'')+'" placeholder="Nome do usuário" data-name-input="'+i+'"><button class="miniBtn nameBtn" data-name-save="'+i+'">SALVAR NOME</button></div>';
      return '<div class="usedItem"><span class="pill '+cls+'">'+badge+'</span><div class="usedTop"><div style="min-width:0;flex:1"><div class="usedKey">'+esc(it.licenseKey||'')+'</div><div class="usedMeta"><b>Nome:</b> '+esc(it.identity||'Acesso antigo')+'<br>Ativada: '+esc(datePt(it.usedAt))+'<br>Último uso: '+esc(datePt(it.lastUsedAt||it.usedAt))+'<br><b>Prazo:</b> '+esc(exp.text)+'<br>Aparelho: '+esc(pending?'LIBERADO PELO ADMINISTRADOR':shortDevice(it.deviceId))+'</div>'+nome+prazo+'</div><div class="usedActions"><button class="miniBtn" data-copy="'+i+'">COPIAR KEY</button>'+toggle+reset+'<button class="miniBtn delete" data-delete="'+i+'">EXCLUIR ACESSO</button></div></div></div>';
    }).join('');
    $('usedList').querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const it=usedItems[Number(b.dataset.copy)];if(!it)return;try{await navigator.clipboard.writeText(String(it.licenseKey||''));b.textContent='COPIADA';setTimeout(()=>b.textContent='COPIAR KEY',1200)}catch(e){}});
    $('usedList').querySelectorAll('[data-days-save]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.daysSave),input=$('usedList').querySelector('[data-days-input="'+i+'"]');setDays(usedItems[i],input,b)});
    $('usedList').querySelectorAll('[data-days-input]').forEach(input=>input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const i=Number(input.dataset.daysInput),b=$('usedList').querySelector('[data-days-save="'+i+'"]');if(b)setDays(usedItems[i],input,b)}}));
    $('usedList').querySelectorAll('[data-name-save]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.nameSave),input=$('usedList').querySelector('[data-name-input="'+i+'"]');setName(usedItems[i],input,b)});
    $('usedList').querySelectorAll('[data-name-input]').forEach(input=>input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const i=Number(input.dataset.nameInput),b=$('usedList').querySelector('[data-name-save="'+i+'"]');if(b)setName(usedItems[i],input,b)}}));
    $('usedList').querySelectorAll('[data-pause]').forEach(b=>b.onclick=()=>toggleAccess(usedItems[Number(b.dataset.pause)],'pause','usedMsg',b));
    $('usedList').querySelectorAll('[data-resume]').forEach(b=>b.onclick=()=>toggleAccess(usedItems[Number(b.dataset.resume)],'resume','usedMsg',b));
    $('usedList').querySelectorAll('[data-reset]').forEach(b=>b.onclick=async()=>{
      const it=usedItems[Number(b.dataset.reset)];if(!it||!it.id)return;const nome=it.identity||'essa identificação';
      if(!confirm('Resetar o aparelho de '+nome+'?\\n\\nO aparelho atual perderá o acesso. A mesma key será usada no próximo aparelho. Nenhuma key nova será consumida.'))return;
      b.disabled=true;b.textContent='RESETANDO...';
      try{const j=await post('/admin/access/reset-device',{keyId:it.id});await reloadAll('usedMsg',j.message||'Aparelho resetado.')}catch(e){$('usedMsg').textContent=e.message;$('usedMsg').className='status bad';b.disabled=false;b.textContent='RESETAR APARELHO'}
    });
    $('usedList').querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{
      const it=usedItems[Number(b.dataset.delete)];if(!it||!it.id)return;const nome=it.identity||'este acesso';
      if(!confirm('Excluir o acesso de '+nome+'?\\n\\nO acesso será cortado imediatamente e a key VOLTARÁ para LIVRE no estoque.'))return;
      b.disabled=true;b.textContent='EXCLUINDO...';
      try{const j=await post('/admin/access/delete-access',{keyId:it.id});await reloadAll('usedMsg',j.message||'Acesso excluído e key devolvida ao estoque.')}catch(e){$('usedMsg').textContent=e.message;$('usedMsg').className='status bad';b.disabled=false;b.textContent='EXCLUIR ACESSO'}
    });
  }

`;
    h=h.slice(0,a)+render+h.slice(b);
    h=h.replace("usedItems.length+' acesso(s) ativo(s) ou pausado(s).'","usedItems.length+' usuário(s) com acesso cadastrado.'");
    h=h.replace("  $('statusBtn').onclick=()=>status(true);",`  $('saveDefaultDaysBtn').onclick=async()=>{
    const btn=$('saveDefaultDaysBtn'),days=Number($('defaultDays').value);
    if(!Number.isInteger(days)||days<0||days>3650){$('defaultDaysMsg').textContent='Digite um número entre 0 e 3650.';$('defaultDaysMsg').className='status bad';return}
    btn.disabled=true;btn.textContent='SALVANDO...';
    try{const j=await post('/admin/access/default-days',{days});$('defaultDaysMsg').textContent=j.message||'Prazo padrão salvo.';$('defaultDaysMsg').className='status ok';await status(false)}catch(e){$('defaultDaysMsg').textContent=e.message;$('defaultDaysMsg').className='status bad'}finally{btn.disabled=false;btn.textContent='SALVAR PRAZO PADRÃO'}
  };
  $('defaultDays').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('saveDefaultDaysBtn').click()}});
  $('statusBtn').onclick=()=>status(true);`);
    document.open();document.write(h);document.close();
  }catch(e){document.body.innerHTML='<div style="max-width:520px;margin:70px auto;padding:20px;text-align:center"><h2>DF EXTRUSOR PRO</h2><p>Não foi possível carregar o painel. Atualize e tente novamente.</p></div>'}
})();
</script>
</body></html>
