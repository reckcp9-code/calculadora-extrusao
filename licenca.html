<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b13">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>DF • Licença</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#080b13;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;display:flex;align-items:center;justify-content:center;padding:20px}
.box{width:min(440px,100%);background:#111827;border:1px solid #263244;border-radius:22px;padding:22px;text-align:center;box-shadow:0 22px 80px #0008}
.logo{width:min(260px,75vw);height:auto;border-radius:14px;margin:0 auto 14px;display:block;background:#000}
h1{font-size:26px;margin:5px 0}
p{color:#94a3b8;font-size:13px;line-height:1.45}
input{width:100%;border:1px solid #334155;background:#0f172a;color:#fff;border-radius:13px;padding:14px;font-size:18px;font-weight:700;text-align:center;outline:none}
input:focus{border-color:#22c55e}
button{width:100%;border:1px solid #16a34a;background:#0c321c;color:#86efac;border-radius:13px;padding:14px;margin-top:11px;font-size:17px;font-weight:900}
button:disabled{opacity:.55}
.msg{min-height:24px;margin-top:12px;font-size:13px;font-weight:700}
.ok{color:#86efac}.err{color:#fca5a5}
.id{margin-top:14px;color:#64748b;font-size:10px;word-break:break-all}
.tag{display:inline-block;background:#052e16;color:#86efac;border:1px solid #166534;padding:4px 9px;border-radius:999px;font-size:12px;margin-bottom:8px}
.foot{margin-top:16px;color:#64748b;font-size:12px;line-height:1.6}
.foot a{color:#86efac;text-decoration:none;font-weight:900}
</style>
</head>
<body>
<div class="box">
  <img class="logo" src="./logo.jpg.jpeg?v=20260904-logo-final" alt="DF Manutenção e Consultoria">
  <div class="tag">USO EXCLUSIVO DF</div>
  <h1>Licença DF</h1>
  <p>Digite sua KEY. Na primeira ativação ela fica vinculada a este navegador/aparelho.</p>
  <input id="key" autocomplete="off" autocapitalize="characters" placeholder="DIGITE SUA KEY">
  <button id="btn">ATIVAR / ENTRAR</button>
  <div id="msg" class="msg"></div>
  <div id="device" class="id"></div>
  <div class="foot">DF Manutenção e Consultoria<br><a href="https://www.instagram.com/df_manutencaoeconsultoria/" target="_blank" rel="noopener">📷 @df_manutencaoeconsultoria</a></div>
</div>
<script>
const KA={name:"Reck.cp9's Application",ownerid:"vJZx40AXf8",version:"1.0"},DK='df_device_v1',LK='df_license_v1';
function dev(){let x=localStorage.getItem(DK);if(!x){x=crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);localStorage.setItem(DK,x)}return x}
function msg(t,ok=false){let e=document.getElementById('msg');e.textContent=t;e.className='msg '+(ok?'ok':'err')}
async function login(k){let b=document.getElementById('btn');b.disabled=true;msg('Verificando licença...');try{let u=new URL('https://keyauth.win/api/1.3/');u.search=new URLSearchParams({type:'init',ver:KA.version,name:KA.name,ownerid:KA.ownerid,hash:'undefined',token:'undefined',thash:'undefined'});let r=await fetch(u,{cache:'no-store'}),j=await r.json();if(!j.success)throw Error(j.message||'Falha ao iniciar KeyAuth');let l=new URL('https://keyauth.win/api/1.3/');l.search=new URLSearchParams({type:'license',key:k,sessionid:j.sessionid,name:KA.name,ownerid:KA.ownerid,hwid:dev(),code:''});let rr=await fetch(l,{cache:'no-store'}),jj=await rr.json();if(!jj.success)throw Error(jj.message||'Licença inválida');localStorage.setItem(LK,k);msg('LICENÇA VÁLIDA • aparelho vinculado',true)}catch(e){msg(e.message||'Falha ao validar a licença')}finally{b.disabled=false}}
document.getElementById('device').textContent='ID deste aparelho: '+dev();
let i=document.getElementById('key'),b=document.getElementById('btn');
b.onclick=()=>{let k=i.value.trim();if(!k)return msg('Digite sua KEY.');login(k)};
i.onkeydown=e=>{if(e.key==='Enter')b.click()};
let s=localStorage.getItem(LK);if(s){i.value=s;login(s)}
</script>
</body>
</html>
