<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b13">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>DF EXTRUSOR PRO — Teste seguro</title>
</head>
<body style="margin:0;background:#080b13;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial">
<script>
(async()=>{
  try{
    const r=await fetch('https://raw.githubusercontent.com/reckcp9-code/calculadora-extrusao/3e570fc08be61679377cd81eb4e90bc45216f4c2/app.html',{cache:'no-store'});
    if(!r.ok) throw new Error('Falha ao carregar aplicativo');
    let h=await r.text();
    const closeScript='</scr'+'ipt>';
    const openScript='<scr'+'ipt>';
    const p=h.lastIndexOf(openScript);
    if(p>=0){
      const e=h.indexOf(closeScript,p);
      if(e>=0)h=h.slice(0,p)+h.slice(e+closeScript.length);
    }

    h=h.replaceAll('src="./logo.jpg.jpeg','src="../logo.jpg.jpeg');
    h=h.replaceAll("location.href='./curso.html'","location.href='../curso.html'");
    h=h.replaceAll('href="./curso.html','href="../curso.html');

    h=h.replace('</body>',
      '<script src="../safe-core.js?v=20260906-safe-core-3"></scr'+'ipt>'+
      '<script src="../cost-safe.js?v=20260906-cost-safe-3"></scr'+'ipt>'+
      '<script src="../formula-unlock.js?v=20260905-unlock-all-v14"></scr'+'ipt>'+
      '<script src="../help-extra.js?v=20260905-help-reader-v17"></scr'+'ipt>'+
      '<script src="../back-extra.js?v=20260905-back-v16"></scr'+'ipt>'+
      '<script src="../bobina-safe.js?v=20260906-bobina-safe-3"></scr'+'ipt>'+
      '<script src="../contact-extra.js?v=20260905-contact-v18"></scr'+'ipt>'+
      '<script src="../pwa-update.js?v=20260906-pwa-notify-v27"></scr'+'ipt>'+
      '<script src="../system-extra.js?v=20260906-a4-whatsapp-v32"></scr'+'ipt>'+
      '<script src="../op-single-safe.js?v=20260906-op-single-safe-2"></scr'+'ipt>'+
      '<script src="../formula-view-safe.js?v=20260906-formula-view-safe-2"></scr'+'ipt>'+
      '<script src="../formula-share-safe.js?v=20260906-a4-whatsapp-v32"></scr'+'ipt>'+
      '<script src="../vendedor-pdf-profissional.js?v=20260906-a4-whatsapp-v32"></scr'+'ipt>'+
      '</body>');
    document.open();
    document.write(h);
    document.close();
  }catch(e){
    document.body.innerHTML='<div style="max-width:520px;margin:80px auto;padding:24px;text-align:center"><h2>DF EXTRUSOR PRO</h2><p>Não foi possível carregar a versão de teste.</p><p style="color:#fca5a5;font-size:12px">'+String(e&&e.message||e)+'</p></div>';
  }
})();
</script>
</body>
</html>
