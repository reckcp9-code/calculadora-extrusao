<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DF Auth Teste</title><style>body{font-family:system-ui;background:#080b13;color:#fff;max-width:700px;margin:40px auto;padding:20px}input,button{width:100%;box-sizing:border-box;padding:14px;margin:8px 0;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff}button{background:#0c321c;border-color:#16a34a;font-weight:800}pre{white-space:pre-wrap;background:#111827;padding:14px;border-radius:10px;border:1px solid #263244}</style></head><body><h2>Teste de autenticação DF</h2><p>Digite uma key válida. Esta página mostra a resposta completa da API apenas para diagnóstico.</p><input id="key" placeholder="Sua key"><button id="go">TESTAR</button><pre id="out">Aguardando...</pre><script>const API='https://df-extrusor-api.reck-cp9.workers.dev';const id=localStorage.getItem('df_debug_device')||crypto.randomUUID();localStorage.setItem('df_debug_device',id);document.getElementById('go').onclick=async()=>{const out=document.getElementById('out');out.textContent='Testando...';try{const r=await fetch(API+'/auth',{method:'POST',headers:{'Content-Type':'application/json','X-DF-Device':id},body:JSON.stringify({licenseKey:document.getElementById('key').value.trim(),deviceId:id}),cache:'no-store'});const t=await r.text();out.textContent='HTTP '+r.status+'\n'+t;}catch(e){out.textContent='FALHA NO FETCH\n'+String(e&&e.message||e);}};</script></body></html>
