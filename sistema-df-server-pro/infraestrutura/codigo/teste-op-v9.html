<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b13"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>DF OP V9</title><style>*{box-sizing:border-box}body{margin:0;background:#080b13;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}.wrap{max-width:760px;margin:auto;padding:18px}.hero,.card{border:1px solid #f5a000;background:#111827;border-radius:20px;padding:18px;margin-bottom:14px}.hero{background:linear-gradient(180deg,#211400,#111827)}h1{margin:0 0 8px;color:#ffd36a;font-size:25px}p{color:#cbd5e1;line-height:1.45}.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{display:flex;align-items:center;justify-content:center;min-height:58px;border-radius:15px;font-weight:900;font-size:15px;border:1px solid #475569;background:#0f172a;color:#fff}.btn.cam{border-color:#f5a000;background:#241600;color:#ffd36a}input{position:absolute;width:1px;height:1px;opacity:0}.hint{margin-top:10px;border:1px dashed #f5a000;border-radius:12px;padding:10px;color:#fde68a;font-weight:800;font-size:13px}.status{margin-top:14px;border:1px solid #334155;background:#0f172a;border-radius:14px;padding:13px;font-weight:800;line-height:1.45}.status.ok{border-color:#166534;color:#86efac}.status.warn{border-color:#a16207;color:#fde68a}.status.bad{border-color:#7f1d1d;color:#fca5a5}img{display:none;width:100%;max-height:430px;object-fit:contain;border-radius:14px;margin-top:12px;background:#000}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.k{border:1px solid #334155;border-radius:12px;padding:10px;background:#0f172a}.k span{display:block;color:#94a3b8;font-size:11px}.k b{font-size:22px}.vals{margin-top:12px;border:1px solid #334155;border-radius:14px;padding:12px;background:#0f172a;line-height:1.5}.vals b{color:#ffd36a}@media(max-width:520px){.btns{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="hero"><h1>🎯 LEITOR OP V9</h1><p>Versão isolada. Lê o QR na orientação correta e depois somente <b>APARAS KG</b> e <b>QUANTIDADE KG</b>. QUANTIDADE KG é a produção.</p></div><div class="card"><div class="btns"><label class="btn cam" for="cam">📷 TIRAR FOTO DE LADO</label><label class="btn" for="file">🖼️ ENVIAR FOTO</label></div><input id="cam" type="file" accept="image/*" capture="environment"><input id="file" type="file" accept="image/*"><div class="hint">↔️ Celular deitado e folha inteira. Resultado esperado nesta OP: Produção 558 kg e Apara 11 kg.</div><img id="preview"><div id="status" class="status">Escolha a foto para começar.</div><div id="result"></div></div></div><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>
const $=id=>document.getElementById(id);function st(t,c='warn'){$('status').className='status '+c;$('status').innerHTML=t}function mk(w,h){let c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c}function rot(src,d){d=((d%360)+360)%360;if(!d)return src;let sw=d===90||d===270,c=mk(sw?src.height:src.width,sw?src.width:src.height),x=c.getContext('2d',{willReadFrequently:true});x.save();if(d===90){x.translate(c.width,0);x.rotate(Math.PI/2)}else if(d===180){x.translate(c.width,c.height);x.rotate(Math.PI)}else{x.translate(0,c.height);x.rotate(-Math.PI/2)}x.drawImage(src,0,0);x.restore();return c}function crop(src,x,y,w,h,s=1){x=Math.max(0,Math.round(x));y=Math.max(0,Math.round(y));w=Math.max(1,Math.min(src.width-x,Math.round(w)));h=Math.max(1,Math.min(src.height-y,Math.round(h)));let c=mk(w*s,h*s),g=c.getContext('2d',{willReadFrequently:true});g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(src,x,y,w,h,0,0,c.width,c.height);return c}function idata(c){return c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,c.width,c.height)}async function fromFile(f,max=3200){return new Promise((res,rej)=>{let i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{let s=Math.min(1,max/Math.max(i.width,i.height)),c=mk(i.width*s,i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c)};i.onerror=()=>rej(new Error('Foto inválida'));i.src=u})}
function qr(c){try{let d=idata(c);return jsQR(d.data,d.width,d.height,{inversionAttempts:'attemptBoth'})||null}catch(e){return null}}function qpos(q,w,h){let p=[q.location.topLeftCorner,q.location.topRightCorner,q.location.bottomLeftCorner,q.location.bottomRightCorner];return{x:p.reduce((a,v)=>a+v.x,0)/4/w,y:p.reduce((a,v)=>a+v.y,0)/4/h}}function findQR(raw){let best=null;for(let deg of [0,90,180,270]){let c=rot(raw,deg),tries=[{c,ox:0,oy:0,sx:1,sy:1},{c:crop(c,0,0,c.width,c.height*.5,2),ox:0,oy:0,sx:1,sy:.5},{c:crop(c,c.width*.12,0,c.width*.6,c.height*.45,2.5),ox:.12,oy:0,sx:.6,sy:.45}];for(let t of tries){let q=qr(t.c);if(!q?.data)continue;let p=qpos(q,t.c.width,t.c.height),px=t.ox+p.x*t.sx,py=t.oy+p.y*t.sy,text=String(q.data).trim();let score=Math.abs(px-.374)*1.5+Math.abs(py-.139)*2.3+(c.width<c.height?1.5:0)+(/^DFOP-/i.test(text)?0:1);if(!best||score<best.score)best={text,page:c,score,px,py,deg}}}return best}
function paperQuad(src){let W=180,H=Math.max(100,Math.round(180*src.height/src.width)),bin=Array.from({length:H},()=>new Uint8Array(W)),im=idata(src).data,sw=src.width,sh=src.height;for(let gy=0;gy<H;gy++)for(let gx=0;gx<W;gx++){let x=Math.min(sw-1,Math.floor((gx+.5)*sw/W)),y=Math.min(sh-1,Math.floor((gy+.5)*sh/H)),i=(y*sw+x)*4,r=im[i],g=im[i+1],b=im[i+2],lum=.299*r+.587*g+.114*b,sat=Math.max(r,g,b)-Math.min(r,g,b);if(lum>105&&sat<125)bin[gy][gx]=1}let seen=Array.from({length:H},()=>new Uint8Array(W)),best=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(!bin[y][x]||seen[y][x])continue;let q=[[x,y]],comp=[],k=0;seen[y][x]=1;while(k<q.length){let [a,b]=q[k++];comp.push([a,b]);for(let [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let nx=a+dx,ny=b+dy;if(nx>=0&&nx<W&&ny>=0&&ny<H&&bin[ny][nx]&&!seen[ny][nx]){seen[ny][nx]=1;q.push([nx,ny])}}}if(comp.length>best.length)best=comp}if(best.length<W*H*.10)return null;let tl=null,tr=null,br=null,bl=null;for(let [x,y] of best){let X=(x+.5)*sw/W,Y=(y+.5)*sh/H,s=X+Y,d=X-Y,p={x:X,y:Y,s,d};if(!tl||s<tl.s)tl=p;if(!br||s>br.s)br=p;if(!tr||d>tr.d)tr=p;if(!bl||d<bl.d)bl=p}return[tl,tr,br,bl]}
function solve(A,b){let n=b.length;for(let i=0;i<n;i++){let m=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;[A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];let p=A[i][i]||1e-12;for(let j=i;j<n;j++)A[i][j]/=p;b[i]/=p;for(let r=0;r<n;r++){if(r===i)continue;let f=A[r][i];for(let j=i;j<n;j++)A[r][j]-=f*A[i][j];b[r]-=f*b[i]}}return b}function homography(dst,src){let A=[],b=[];for(let i=0;i<4;i++){let u=dst[i].x,v=dst[i].y,x=src[i].x,y=src[i].y;A.push([u,v,1,0,0,0,-u*x,-v*x]);b.push(x);A.push([0,0,0,u,v,1,-u*y,-v*y]);b.push(y)}return solve(A,b)}function warp(src,q,W=1684,H=1191){let dst=[{x:0,y:0},{x:W-1,y:0},{x:W-1,y:H-1},{x:0,y:H-1}],h=homography(dst,q),si=idata(src).data,sw=src.width,sh=src.height,o=mk(W,H),g=o.getContext('2d'),od=g.createImageData(W,H),d=od.data;for(let y=0;y<H;y++)for(let x=0;x<W;x++){let den=h[6]*x+h[7]*y+1,sx=(h[0]*x+h[1]*y+h[2])/den,sy=(h[3]*x+h[4]*y+h[5])/den,ix=Math.max(0,Math.min(sw-1,Math.round(sx))),iy=Math.max(0,Math.min(sh-1,Math.round(sy))),s=(iy*sw+ix)*4,t=(y*W+x)*4;d[t]=si[s];d[t+1]=si[s+1];d[t+2]=si[s+2];d[t+3]=255}g.putImageData(od,0,0);return o}
function blue(r,g,b){return b>40&&(b-r)>4&&(b-g)>-5&&(b<253||r<225)}const START=.02138,CW=.08703,ROWY=.6854,ROWH=.02688;function maskCell(page,row,col,dy=0,ex=.10){let x=(START+col*CW-ex*CW)*page.width,y=(ROWY+row*ROWH+dy)*page.height,w=CW*(1+2*ex)*page.width,h=ROWH*page.height,raw=crop(page,x,y,w,h,6),im=idata(raw),o=mk(raw.width,raw.height),g=o.getContext('2d'),od=g.createImageData(o.width,o.height),ink=0;for(let i=0;i<im.data.length;i+=4){let r=im.data[i],gg=im.data[i+1],b=im.data[i+2],is=blue(r,gg,b);if(is)ink++;let v=is?0:255;od.data[i]=od.data[i+1]=od.data[i+2]=v;od.data[i+3]=255}g.putImageData(od,0,0);return ink<7?null:o}function clean(s){return String(s||'').toUpperCase().replace(/[OQD]/g,'0').replace(/[IL|]/g,'1').replace(/S/g,'5').replace(/B/g,'8').replace(/Z/g,'2').replace(/[^0-9,.-]/g,'').trim()}function nval(s){let n=parseFloat(clean(s).replace(',','.'));return Number.isFinite(n)?n:0}async function readNum(w,page,row,col,type){let best={v:0,raw:'',conf:-1};for(let dy of [-.004,0,.004])for(let ex of [.05,.11,.18]){let c=maskCell(page,row,col,dy,ex);if(!c)continue;for(let psm of ['7','8','13']){await w.setParameters({tessedit_pageseg_mode:psm,tessedit_char_whitelist:'0123456789,.',user_defined_dpi:'300'});let r=await w.recognize(c),raw=String(r?.data?.text||'').trim(),v=nval(raw),cf=Number(r?.data?.confidence||0),ok=type==='prod'?v>=20&&v<=3000:v>0&&v<=300;if(ok&&(cf>best.conf||(best.v===0&&v>0)))best={v,raw,conf:cf}}}return best}
async function process(f){try{$('preview').src=URL.createObjectURL(f);$('preview').style.display='block';$('result').innerHTML='';st('📷 Procurando QR e orientação correta...');let raw=await fromFile(f),found=findQR(raw);if(!found){st('⚠️ QR não encontrado. Pegue a folha inteira.','warn');return}let oriented=found.page,q=paperQuad(oriented),page=q?warp(oriented,q):oriented;if(page.width<page.height)page=rot(page,90);st('✅ QR: <b>'+found.text+'</b><br>↔️ Orientação '+found.deg+'° corrigida.<br>🎯 Lendo só APARAS KG e QUANTIDADE KG...');let w=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text')st('✅ QR identificado.<br>🎯 Lendo números... <b>'+Math.round((m.progress||0)*100)+'%</b>')}}),aparas=[],prods=[],dbg=[];for(let row=0;row<8;row++){let a=await readNum(w,page,row,3,'apara'),p=await readNum(w,page,row,4,'prod');if(a.v)aparas.push(a.v);if(p.v)prods.push(p.v);if(a.v||p.v)dbg.push('L'+(row+1)+': '+(a.raw||'-')+' / '+(p.raw||'-'))}await w.terminate();let at=aparas.reduce((a,b)=>a+b,0),pt=prods.reduce((a,b)=>a+b,0);st('✅ <b>LEITURA CONCLUÍDA</b><br>Produção total: <b>'+pt+' kg</b><br>Apara total: <b>'+at+' kg</b>',pt||at?'ok':'warn');$('result').innerHTML='<div class="kpis"><div class="k"><span>PRODUÇÃO TOTAL</span><b>'+pt+' kg</b></div><div class="k"><span>APARA TOTAL</span><b>'+at+' kg</b></div></div><div class="vals"><b>QUANTIDADE KG:</b> '+(prods.length?prods.join(' + ')+' = '+pt:'nenhum valor')+'<br><b>APARAS KG:</b> '+(aparas.length?aparas.join(' + ')+' = '+at:'nenhum valor')+'<br><small>'+dbg.join(' • ')+'</small></div>'}catch(e){st('❌ '+(e.message||e),'bad')}}$('cam').onchange=e=>{let f=e.target.files?.[0];if(f)process(f)};$('file').onchange=e=>{let f=e.target.files?.[0];if(f)process(f)};
</script></body></html>
