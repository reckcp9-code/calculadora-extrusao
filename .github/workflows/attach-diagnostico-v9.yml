name: Conectar Diagnostico Tecnico v9

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/attach-diagnostico-v9.yml'

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Validar e conectar modulo
        shell: bash
        run: |
          node --check extrusora/diagnostico-tecnico-v9.js
          python - <<'PY'
          from pathlib import Path
          p=Path('extrusora/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./diagnostico-tecnico-v9.js?v=9.1"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Publicar alteracao
        shell: bash
        run: |
          if git diff --quiet -- extrusora/index.html; then
            echo 'Nenhuma alteracao necessaria.'
            exit 0
          fi
          git config user.name 'DF Extrusor Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add extrusora/index.html
          git commit -m 'Ativa diagnostico tecnico v9 no app'
          git push origin HEAD:main
