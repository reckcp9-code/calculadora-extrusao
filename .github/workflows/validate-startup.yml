name: Validate DF Extrusor startup
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate-startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate main JavaScript syntax and HTML inline scripts
        shell: bash
        run: |
          set -euo pipefail
          node --check app-bundle.js
          node --check team-formulas-duplicates-v2.js
          node --check op-landscape-pdf.js
          node --check formula-saved-search-v1.js
          node --check op-prontas-manual-product-v2.js
          node --check op-name-at-creation-v1.js
          node --check op-product-d1-authority-v1.js
          node --check performance-guard-v3.js
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          for (const file of ['index.html', 'app-shell.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const blocks = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
            for (let i = 0; i < blocks.length; i++) {
              if (!blocks[i][1].trim()) continue;
              try { new vm.Script(blocks[i][1], {filename: file + ':inline-' + i}); }
              catch (err) { console.error(err); process.exitCode = 1; }
            }
            console.log(file + ': ' + blocks.length + ' inline script tags inspected');
          }
          NODE
      - name: Prevent regression in Fotos and Prontas
        run: |
          set -euo pipefail
          node --check op-monthly-photo-editor-v1.js
          node --check formula-op-relatorio.js
          node --check op-server-authority-v1.js
          node --check client-stability-v127.js
          node --check op-status-artifact-filter-v170.js
          node <<'NODE'
          const fs = require('fs');
          const assert = require('node:assert/strict');
          const photo = fs.readFileSync('op-monthly-photo-editor-v1.js','utf8');
          const formula = fs.readFileSync('formula-op-relatorio.js','utf8');
          const authority = fs.readFileSync('op-server-authority-v1.js','utf8');
          const monthGuard = fs.readFileSync('op-status-artifact-filter-v170.js','utf8');
          const startup = fs.readFileSync('client-stability-v127.js','utf8');
          assert.match(formula, /id="dfMonthlyPhotoButton"/, 'FOTOS must be part of the primary menu');
          assert.match(photo, /df-op-d1-applied/, 'FOTOS must respond to official D1 synchronization');
          assert.match(photo, /DFOpServerAuthority\.sync/, 'FOTOS must request authoritative D1 records');
          assert.match(photo, /readSnapshot/, 'FOTOS needs safe local fallback for delayed cloud reads');
          assert.match(photo, /dfMonthlyPhotoMonth/, 'FOTOS must allow a visible month choice');
          assert.match(authority, /!serverIds\.has\(id\)&&!tombs\[id\]/, 'Partial D1 responses must not erase local OPs');
          assert.match(monthGuard, /wanted=selectedMonth\(\)/, 'Prontas must respect the selected month');
          assert.match(startup, /df_production_history_month_v1/, 'Restart must retain the chosen month');
          console.log('Fotos and Prontas regression guards passed');
          NODE
      - name: Testar restauracao de Prontas e botao da equipe
        run: |
          node --check op-ui-integrity-v1.js
          node --check op-team-panel-collapse-v1.js
          node --check op-ready-fullscreen-v1.js
          node --check op-cloud-team-v3.js
          node --check op-team-code-pwa-v166.js
          node tests/op-ui-integrity.test.js
      - name: Testar recuperação permanente de equipe pela licença
        run: |
          set -euo pipefail
          node --check team-license-restore-v1.js
          node --check .github/workers/df-team-license-restore-v1.js
          node tests/team-license-restore.test.js
      - name: Conferir serviço de restauração na Cloudflare
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 15 'https://df-team-license-restore-v1.reck-cp9.workers.dev/health' | grep -q '"ok":true'
          code=$(curl --silent --show-error --max-time 15 -o /tmp/df-team-unauthorized.json -w '%{http_code}' \
            -X POST 'https://df-team-license-restore-v1.reck-cp9.workers.dev/restore' \
            -H 'Origin: https://app.dfextrusor.com.br' -H 'Content-Type: application/json' \
            --data '{"credential":"INVALID-CREDENTIAL-CI-ONLY","deviceId":"invalid-ci-device-id"}')
          test "$code" = "401"
      - name: Validate startup references and app version
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const version = JSON.parse(fs.readFileSync('app-version.json', 'utf8')).version;
          if (!version || !/^\d+\.\d+\.\d+$/.test(version)) throw Error('Invalid app version');
          if (!html.includes('app-bundle.js?v=')) throw Error('Main app script reference missing');
          if (!html.includes('app-shell.html')) throw Error('App shell reference missing');
          if (!html.includes('Carregando DF Extrusor Pro')) throw Error('Expected startup fallback missing');
          if (!html.includes('op-name-at-creation-v1.js')) throw Error('OP name sync script missing');
          if (!html.includes('op-prontas-manual-product-v2.js')) throw Error('OP completed name module missing');
          if (!html.includes('performance-guard-v3.js')) throw Error('Performance guard missing');
          const refs=[...html.matchAll(/['\"]([a-zA-Z0-9_.-]+\.js)\?v=/g)].map(m=>m[1]);
          const missing=[...new Set(refs)].filter(f=>!fs.existsSync(f));
          if(missing.length)throw Error('Referenced JS files missing: '+missing.join(', '));
          console.log('Startup references OK; version ' + version);
          NODE
