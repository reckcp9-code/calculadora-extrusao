name: Patch team permissions v178
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-team-permissions-v178.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate and patch
        run: |
          node --check team-tab-permissions-v178.js
          node --check gerador-team-permissions-v178.js
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('20260915-op-meta-v177','20260916-team-perm-v178')
          marker="      'runtime-stability-v3.js?v='+BUILD,\n"
          line="      'team-tab-permissions-v178.js?v='+BUILD,\n"
          if 'team-tab-permissions-v178.js?v=' not in s:
              if marker not in s:
                  raise SystemExit('index marker not found')
              s=s.replace(marker,marker+line,1)
          p.write_text(s)

          gpath=Path('gerar-acesso.html')
          g=gpath.read_text()
          if 'gerador-team-permissions-v178.js' not in g:
              anchor='gerador-bulk-days-v1.js?v=20260914-bulk-days-v1'
              pos=g.find(anchor)
              if pos<0:
                  raise SystemExit('generator anchor not found')
              end=g.find('</body>',pos)
              if end<0:
                  raise SystemExit('generator body marker not found')
              insert=r'''<script src=\"./gerador-team-permissions-v178.js?v=20260916-team-perm-v178\"></scr'+'ipt>'''
              g=g[:end]+insert+g[end:]
          gpath.write_text(g)
          PY
          grep -q "team-tab-permissions-v178.js" index.html
          grep -q "gerador-team-permissions-v178.js" gerar-acesso.html
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html gerar-acesso.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Ativa permissões de abas por equipe v178'
          git push