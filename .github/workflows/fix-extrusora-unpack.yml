name: Corrigir Central Tecnica no iPhone

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-extrusora-unpack.yml'

permissions:
  contents: write

jobs:
  inspect-central:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inspecionar payload atual e historico
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, string, base64, gzip

          refs = [
            ('atual','HEAD','extrusora/index.html'),
            ('bb80','bb80a3b3f0ebcc0eded886f9acdebbb0aec14649','extrusora/index.html'),
            ('1fb34','1fb34c32584afd601a4a99d23f016baeba6eb0a0','extrusora/index.html'),
            ('base1fb34','1fb34c32584afd601a4a99d23f016baeba6eb0a0','extrusora/base-v6.html'),
          ]
          allowed = set(string.ascii_letters + string.digits + '+/=')
          for label, ref, path in refs:
            try:
              if ref == 'HEAD':
                source = Path(path).read_text(encoding='utf-8')
              else:
                source = subprocess.check_output(['git','show',f'{ref}:{path}'], text=True)
            except Exception as e:
              print(label, 'READ_FAIL', e)
              continue
            m = re.search(r"atob\('([^']+)'\)", source)
            if not m:
              print(label, 'NO_PAYLOAD', 'len=',len(source))
              continue
            payload = m.group(1)
            clean = re.sub(r'\s+', '', payload)
            bad_positions = [(i,c) for i,c in enumerate(clean) if c not in allowed]
            print('\n###',label,'payload_len',len(payload),'clean_len',len(clean),'bad_count',len(bad_positions))
            for i,c in bad_positions[:30]:
              a=max(0,i-80); b=min(len(clean),i+140)
              print('BAD',i,repr(c),'CTX',repr(clean[a:b]))
            filtered=''.join(c for c in clean if c in allowed)
            try:
              packed=base64.b64decode(filtered, validate=True)
              print('filtered_base64_ok bytes',len(packed))
              try:
                html=gzip.decompress(packed).decode('utf-8')
                print('gzip_ok html_len',len(html),'title_ctx',repr(html[:180]))
              except Exception as e:
                print('gzip_fail',repr(e))
            except Exception as e:
              print('filtered_base64_fail',repr(e),'filtered_len',len(filtered),'mod4',len(filtered)%4)
          PY
