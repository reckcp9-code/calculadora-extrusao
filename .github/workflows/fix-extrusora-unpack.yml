name: Corrigir Central Tecnica no iPhone

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-extrusora-unpack.yml'

permissions:
  contents: write

jobs:
  inspect-history:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto com historico
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Procurar uma copia integra da Central Tecnica
        shell: bash
        run: |
          python - <<'PY'
          import subprocess, re, base64, gzip, string

          commits = subprocess.check_output(['git','rev-list','--all','--','extrusora/index.html','extrusora/base-v6.html'], text=True).split()
          print('commits_encontrados', len(commits))
          seen=set()
          allowed=set(string.ascii_letters+string.digits+'+/=')
          found=[]
          for commit in commits:
            for path in ('extrusora/index.html','extrusora/base-v6.html'):
              try:
                blob=subprocess.check_output(['git','rev-parse',f'{commit}:{path}'], text=True, stderr=subprocess.DEVNULL).strip()
                if blob in seen: continue
                seen.add(blob)
                src=subprocess.check_output(['git','show',f'{commit}:{path}'], text=True, stderr=subprocess.DEVNULL)
              except Exception:
                continue
              title='Central Técnica de Extrusão' in src or 'Central Tecnica de Extrusao' in src
              ell='ELLIPSIZATION' in src
              m=re.search(r"atob\('([^']+)'\)",src)
              state='raw'
              detail=''
              if m:
                p=re.sub(r'\s+','',m.group(1))
                bad=sum(1 for c in p if c not in allowed)
                state=f'payload bad={bad} len={len(p)} mod4={len(p)%4}'
                if bad==0:
                  try:
                    packed=base64.b64decode(p,validate=True)
                    html=gzip.decompress(packed).decode('utf-8')
                    state+=f' GZIP_OK html={len(html)} central={"Central Técnica" in html or "Central Tecnica" in html}'
                    found.append((commit,path,blob,len(html)))
                  except Exception as e:
                    detail=f' decode_fail={e!r}'
              print(commit[:10], path, blob[:10], 'len',len(src),'title',title,'ellipsization',ell,state,detail)
          print('VALIDOS',found)

          print('\nBRANCH_HEADS')
          branches=subprocess.check_output(['git','for-each-ref','--format=%(refname:short)','refs/remotes/origin'],text=True).splitlines()
          for br in branches:
            for path in ('extrusora/index.html','extrusora/base-v6.html'):
              try:
                src=subprocess.check_output(['git','show',f'{br}:{path}'],text=True,stderr=subprocess.DEVNULL)
              except Exception: continue
              if 'Central Técnica' in src or 'Central Tecnica' in src or "atob('" in src:
                print(br,path,'len',len(src),'ELL', 'ELLIPSIZATION' in src,'payload',bool(re.search(r"atob\('([^']+)'\)",src)))
          PY
