name: Corrigir Central Tecnica no iPhone

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/fix-extrusora-unpack.yml'

permissions:
  contents: write

jobs:
  restore-stable:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto com historico
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar base integra e manter modulo de rosca
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          stable_ref='c4c8fecbc1a6172a2a92ed3565b49d5357c7e50c'
          html=subprocess.check_output(['git','show',f'{stable_ref}:extrusora/base-v6.html'],text=True)
          if len(html) < 20000 or '<!doctype html>' not in html.lower() or '</html>' not in html.lower():
              raise SystemExit('Base estável histórica inválida')
          if 'ELLIPSIZATION' in html or "atob('" in html:
              raise SystemExit('Base histórica não é íntegra')

          # Mantém a identidade atual sem depender de descompactação no navegador.
          html=html.replace('<title>DF • Calculadora Privada de Extrusoras</title>','<title>DF • Central Técnica de Extrusão</title>')
          module='<script src="./rosca-compressao-v7.js?v=7.2"></script>'
          if module not in html:
              html=html.replace('</body>',module+'\n</body>')

          Path('extrusora/index.html').write_text(html,encoding='utf-8')
          print('index.html restaurado como HTML direto:',len(html),'caracteres')
          PY

      - name: Validar pagina antes de publicar
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('extrusora/index.html').read_text(encoding='utf-8')
          checks={
            'doctype':'<!doctype html>' in p.lower(),
            'fim_html':'</html>' in p.lower(),
            'sem_ellipsization':'ELLIPSIZATION' not in p,
            'sem_loader_comprimido':"atob('" not in p,
            'modulo_rosca':'rosca-compressao-v7.js' in p,
          }
          print(checks)
          if not all(checks.values()): raise SystemExit('Validação falhou')
          PY

      - name: Publicar correcao
        shell: bash
        run: |
          git config user.name 'DF Extrusor Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add extrusora/index.html
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
            exit 0
          fi
          git commit -m 'Restaura Central Técnica em HTML direto para iPhone'
          git push origin HEAD:main
