name: DF Enterprise Audit

on:
  push:
    branches: [auditoria-completa-20261002, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Auditoria completa
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cp=require('child_process');
          const errors=[],warnings=[],ok=[],perf=[];
          const fail=m=>errors.push(m),warn=m=>warnings.push(m),pass=m=>ok.push(m);
          const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.name==='.git'?[]:e.isDirectory()?walk(path.join(d,e.name)):[path.join(d,e.name)]);
          const files=walk('.').map(f=>f.replace(/^\.\//,''));
          const js=files.filter(f=>f.endsWith('.js'));
          const json=files.filter(f=>f.endsWith('.json'));
          for(const f of js){try{cp.execFileSync(process.execPath,['--check',f],{stdio:'pipe'});pass('JS '+f)}catch(e){fail('Sintaxe JS: '+f+' — '+String(e.stderr||e.message).replace(/\s+/g,' ').slice(0,500))}}
          for(const f of json){try{JSON.parse(fs.readFileSync(f,'utf8'));pass('JSON '+f)}catch(e){fail('JSON inválido: '+f+' — '+e.message)}}
          const required=['index.html','app-shell.html','app-bundle.js','sw.js','manifest.webmanifest','app-version.json','auto-access.js','production-stability-v1.js','data-integrity-v2.js','runtime-stability-v5.js','material-manager.js','team-materials-shared-v1.js','op-producao.html','producao-pdf-native-v1.js','producao-pdf-native-v6.js'];
          required.forEach(f=>fs.existsSync(f)?pass('Existe '+f):fail('Arquivo crítico ausente: '+f));
          const index=fs.readFileSync('index.html','utf8');
          const production=fs.readFileSync('op-producao.html','utf8');
          const active=[...index.matchAll(/["'](?:\.\/)?([A-Za-z0-9_./-]+\.js)(?:\?[^"']*)?["']/g)].map(m=>m[1]);
          const prodActive=[...production.matchAll(/["'](?:\.\/)?([A-Za-z0-9_./-]+\.js)(?:\?[^"']*)?["']/g)].map(m=>m[1]);
          const unique=[...new Set(active)];
          const prodUnique=[...new Set(prodActive)];
          [...new Set([...unique,...prodUnique])].forEach(f=>fs.existsSync(f)?pass('Referência '+f):fail('JS referenciado e ausente: '+f));
          const dup=active.filter((x,i)=>active.indexOf(x)!==i);
          if(dup.length)warn('Referências JS duplicadas: '+[...new Set(dup)].join(', '));
          const risky=unique.filter(f=>/(^|\/)(teste|test|preview)|-test/i.test(f));
          if(risky.length)warn('Módulos ativos ainda com nome de teste: '+risky.join(', '));
          const productionCopies=['formula-mobile-nav-fix-v1.js','team-formulas-duplicates-v2.js','formula-material-picker-v1.js','op-production-now-product-details-v172.js','op-production-now-client-v175.js','formula-ready-library-v2.js'];
          productionCopies.forEach(f=>fs.existsSync(f)?pass('Cópia de produção preparada: '+f):warn('Cópia de produção ainda ausente: '+f));

          // Conflitos/performance somente nos módulos realmente ativos.
          const runtimeUnique=[...new Set([...unique,...prodUnique])];
          const activeText=runtimeUnique.filter(f=>fs.existsSync(f)).map(f=>({f,t:fs.readFileSync(f,'utf8')}));
          const monkey=[];const observers=[];const fastTimers=[];const swRegisters=[];
          for(const {f,t} of activeText){
            if(/(?:window|globalThis)\.fetch\s*=|Storage\.prototype\.setItem\s*=|localStorage\.setItem\s*=|window\.onerror\s*=/.test(t))monkey.push(f);
            if(/new\s+MutationObserver\s*\(/.test(t)&&/subtree\s*:\s*true/.test(t))observers.push(f);
            const ms=[...t.matchAll(/setInterval\s*\([^,]+,\s*(\d{1,5})\s*\)/g)].map(m=>Number(m[1])).filter(n=>n>0&&n<500);
            if(ms.length)fastTimers.push(f+' ('+[...new Set(ms)].join('/')+' ms)');
            if(/serviceWorker\.register\s*\(/.test(t))swRegisters.push(f);
          }
          if(monkey.length>1)warn('Vários módulos alteram APIs globais: '+monkey.join(', '));
          else if(monkey.length)perf.push('API global alterada por: '+monkey[0]);
          if(observers.length>8)warn('Muitos MutationObservers globais/subtree ativos ('+observers.length+'): '+observers.join(', '));
          else if(observers.length)perf.push('MutationObservers subtree: '+observers.length+' — '+observers.join(', '));
          if(fastTimers.length>5)warn('Muitos timers abaixo de 500 ms ('+fastTimers.length+'): '+fastTimers.join(', '));
          else if(fastTimers.length)perf.push('Timers rápidos: '+fastTimers.join(', '));
          if(swRegisters.length>1)warn('Mais de um módulo registra Service Worker: '+swRegisters.join(', '));
          else if(swRegisters.length)perf.push('Registro de Service Worker: '+swRegisters[0]);

          const sw=fs.readFileSync('sw.js','utf8');
          if(/stability-test/i.test(sw))warn('Cache do service worker ainda usa nome de teste');
          const swRefs=[...sw.matchAll(/["']\.\/([A-Za-z0-9_./-]+\.(?:js|html|json|svg|jpeg|webmanifest))["']/g)].map(m=>m[1]);
          [...new Set(swRefs)].forEach(f=>fs.existsSync(f)?pass('SW '+f):fail('Service worker referencia arquivo ausente: '+f));
          const navStart=sw.indexOf("if(req.mode==='navigate')");
          const navEnd=navStart>=0?sw.indexOf('const p=url.pathname',navStart):-1;
          const navBlock=navStart>=0?sw.slice(navStart,navEnd>navStart?navEnd:navStart+800):'';
          if(navBlock.includes('networkFirst(req)'))warn('Navegação ainda usa network-first; pode demorar offline');
          const criticalOffline=['auto-access.js','performance-guard-v3.js','error-monitor-v1.js','production-stability-v1.js','app-bundle.js','material-manager.js','team-materials-shared-v1.js','formula-delete-tombstone-v1.js','formula-saved-search-v1.js','acessar.html','op-producao.html','producao-pdf-native-v1.js','producao-pdf-native-v6.js'];
          criticalOffline.forEach(f=>{if(!sw.includes("'./"+f+"'"))warn('Não precacheado: '+f)});
          if(fs.existsSync('package.json')){try{cp.execFileSync('npm',['audit','--omit=dev','--audit-level=high'],{stdio:'pipe'});pass('npm audit')}catch(e){fail('npm audit encontrou vulnerabilidade alta/crítica')}}else pass('Projeto sem dependências npm');
          const legacy=files.filter(f=>/(^|\/)(preview-|backup-|teste\/)|-test/i.test(f));
          const report=[
            '# DF Enterprise Audit',
            'Commit: '+(process.env.GITHUB_SHA||''),
            'JS ativos app: '+unique.length,
            'JS ativos Produção: '+prodUnique.length,
            'JS no repositório: '+js.length,
            'Candidatos a legado/teste: '+legacy.length,
            'Avisos: '+warnings.length,
            'Erros: '+errors.length,
            '',
            '## ERROS',errors.length?errors.join('\n'):'Nenhum',
            '',
            '## AVISOS',warnings.length?warnings.join('\n'):'Nenhum',
            '',
            '## DESEMPENHO / CONFLITOS',perf.length?perf.join('\n'):'Nenhum conflito simples detectado',
            '',
            '## MÓDULOS ATIVOS',runtimeUnique.join('\n'),
            '',
            '## CANDIDATOS A LEGADO/TESTE',legacy.join('\n')
          ].join('\n');
          fs.writeFileSync('audit-report.txt',report);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## DF Enterprise Audit\n\n- JS ativos app: '+unique.length+'\n- JS ativos Produção: '+prodUnique.length+'\n- JS no repositório: '+js.length+'\n- Candidatos a legado/teste: '+legacy.length+'\n- Avisos: '+warnings.length+'\n- Erros: '+errors.length+'\n');
          console.log(report);
          if(errors.length)process.exit(1);
          NODE
      - name: Salvar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: df-enterprise-audit-report
          path: audit-report.txt
          if-no-files-found: error
