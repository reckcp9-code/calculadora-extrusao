<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DF PRO | TV</title><style>*{box-sizing:border-box}body{margin:0;background:#080f20;color:#eef5ff;font-family:Arial,sans-serif;padding:3vw}header{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:3px solid #efb72e;padding-bottom:20px}h1{font-size:clamp(25px,3.3vw,52px);margin:0}h1 span{color:#f4ba31}small,.muted{color:#a9b9d1}button{cursor:pointer;border:0;border-radius:10px;background:#1b5ca6;color:white;padding:14px 20px;font-weight:700;font-size:16px}input{width:100%;padding:14px;background:#101e35;color:white;border:1px solid #3a608c;border-radius:9px;font-size:17px}label{display:block;color:#b8c9e1;margin-bottom:6px}.card{background:#101e35;border:2px solid #2868b6;border-radius:17px;padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr));gap:18px;margin-top:25px}.value{font-size:clamp(25px,3vw,48px);font-weight:800;margin:10px 0}.metrics{display:flex;gap:15px;flex-wrap:wrap}.metric{flex:1;min-width:130px;background:#0a1528;padding:15px;border-radius:12px}.banner{padding:15px;margin:20px 0;border-radius:10px;background:#172944;color:#e4eeff}a{color:#9ec7ff}</style></head><body><header><div><h1>DF EXTRUSOR <span>PRO</span></h1><small>PRODUÇÃO MANUAL • PAINEL SMART TV</small></div><div id="clock" style="font-size:clamp(24px,3vw,42px)"></div></header><div id="status" class="banner">Carregando lançamentos…</div><section id="totals"></section><main class="grid" id="cards"></main><small style="display:block;margin-top:30px">Atualização automática a cada 30 segundos • Somente leitura</small><script>const API="https://df-tv-manual-v1.reck-cp9.workers.dev",$=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:2,minimumFractionDigits:2}),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));async function refresh(){try{const r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Falha de conexão');const d=await r.json(),a=Array.isArray(d.entries)?d.entries:[];$('status').textContent=d.updatedAt?'Último lançamento: '+new Date(d.updatedAt).toLocaleString('pt-BR'):'Aguardando o primeiro lançamento pelo celular';const p=a.reduce((s,x)=>s+Number(x.production||0),0),q=a.reduce((s,x)=>s+Number(x.scrap||0),0);$('totals').innerHTML='<div class="grid"><div class="card"><small>PRODUÇÃO LANÇADA</small><div class="value">'+fmt(p)+' kg</div></div><div class="card"><small>APARA LANÇADA</small><div class="value">'+fmt(q)+' kg</div></div></div>';$('cards').innerHTML=a.length?a.map(x=>'<div class="card"><h2>'+esc(x.machine)+'</h2><small>OPERADOR: '+esc(x.operator||'Não informado')+'</small><div class="metrics"><div class="metric"><small>PRODUÇÃO</small><div class="value">'+fmt(x.production)+' kg</div></div><div class="metric"><small>APARA</small><div class="value">'+fmt(x.scrap)+' kg</div></div></div></div>').join(''):'<div class="card">Nenhuma máquina lançada ainda.</div>'}catch(e){$('status').textContent='Sem conexão com o painel. Mantendo últimos valores exibidos.'}}function clock(){$('clock').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}clock();refresh();setInterval(clock,1000);setInterval(refresh,30000);</script></body></html>
