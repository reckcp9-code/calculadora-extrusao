<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>DF Extrusor Pro | Painel TV</title><style>*{box-sizing:border-box}body{margin:0;background:#070e1d;color:#f3f7ff;font-family:system-ui,-apple-system,Arial,sans-serif;padding:3vw}header{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:3px solid #e8a918;padding-bottom:22px}h1{font-size:clamp(26px,3vw,54px);margin:0}h1 span{color:#f2b52b}small{color:#9db0ce;font-size:clamp(14px,1.3vw,22px)}#clock{font-size:clamp(20px,2.3vw,40px);font-weight:800}.notice{margin:24px 0;background:#17263d;border:1px solid #456392;border-radius:14px;padding:18px;font-size:clamp(15px,1.3vw,23px)}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,390px),1fr));gap:20px;margin-top:28px}.card{border:2px solid #2967b8;background:#101d34;border-radius:20px;padding:25px}.name{font-size:clamp(20px,2vw,32px);font-weight:800;margin-bottom:15px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:14px}.metric{border:1px solid #274e82;border-radius:12px;padding:15px;background:#0c172b}.metric label{display:block;color:#a9bad4;font-size:clamp(13px,1.1vw,19px);margin-bottom:8px}.metric strong{font-size:clamp(20px,2.1vw,38px)}.empty{font-size:24px;color:#afc0d8;padding:45px;text-align:center}footer{color:#9aaac3;margin-top:35px;text-align:center}button{border:1px solid #487ac0;border-radius:10px;padding:12px 18px;background:#152f55;color:white;font-weight:bold;cursor:pointer}@media(max-width:600px){.metrics{grid-template-columns:1fr 1fr}.card{padding:16px}}</style></head><body><header><div><h1>DF EXTRUSOR <span>PRO</span></h1><small>PAINEL DE PRODUÇÃO • SMART TV</small></div><div style="text-align:right"><div id="clock"></div><small id="month"></small></div></header><div class="notice" id="notice">Verificando dados deste dispositivo…</div><main class="cards" id="cards"></main><footer>Painel somente leitura • Nenhuma OP é alterada nesta página • <button onclick="render()">ATUALIZAR</button></footer><script>const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}),num=v=>{let s=String(v??'').trim().replace(/\s/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');return Number(s)||0},read=(k,f)=>{try{return JSON.parse(localStorage.getItem(k)||'null')??f}catch{return f}},esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));function render(){const cad=read('df_producao_cadastros_v1',{}),a=read('df_producao_ops_auto_v1',[]),m=new Date().toISOString().slice(0,7),machines=[...new Set(['Picote','Sacoleira','Blocadora'].flatMap(k=>cad?.[k]?.machines||[]))],rows=(Array.isArray(a)?a:[]).filter(x=>x?.status==='ok'&&String(x.completedAt||x.autoUpdatedAt||x.createdAt||'').slice(0,7)===m);$('month').textContent=new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'});$('notice').textContent='VISUALIZAÇÃO LOCAL: este painel ainda não recebe automaticamente os dados de outros celulares ou da equipe. Para uso na Smart TV, falta conectar a sincronização segura da produção. Não utilize esta tela como fechamento oficial.';$('cards').innerHTML=machines.length?machines.map(name=>{const rs=rows.filter(x=>String(x.machine||'').trim().toLowerCase()===String(name).trim().toLowerCase()),p=rs.reduce((s,x)=>s+num(x.production??x.totalProduction??x.autoProduction),0),ap=rs.reduce((s,x)=>s+num(x.scrap??x.apara??x.autoScrap),0);return '<section class="card"><div class="name">'+esc(name)+'</div><div class="metrics"><div class="metric"><label>PRODUÇÃO LOCAL</label><strong>'+fmt(p)+' kg</strong></div><div class="metric"><label>APARA LOCAL</label><strong>'+fmt(ap)+' kg</strong></div></div></section>'}).join(''):'<div class="empty">Nenhum cadastro de máquina disponível neste navegador. A sincronização entre aparelhos ainda precisa ser conectada.</div>'}function clock(){$('clock').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}clock();render();setInterval(clock,1000);setInterval(render,30000);</script></body></html>
