<script>
(async()=>{
  try{
    try{localStorage.setItem('df_formula_dev_v1','1');localStorage.setItem('df_formula_dev','1')}catch(e){}
    const r=await fetch('./app-shell.html?v=20260910-stable-v106',{cache:'no-store'});

    const close='</scr'+'ipt>',open='<scr'+'ipt>';
    const p=h.lastIndexOf(open);if(p>=0){const e=h.indexOf(close,p);if(e>=0)h=h.slice(0,p)+h.slice(e+close.length)}
    const tags='<scr'+'ipt defer src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></scr'+'ipt>'+
      '<scr'+'ipt defer src="./op-qr-hook.js?v=20260910-op-auto-v3"></scr'+'ipt>'+

    h=h.replace('</body>',tags+'</body>');
    document.open();document.write(h);document.close();
  }catch(e){document.body.innerHTML='<div style="max-width:520px;margin:80px auto;padding:24px;text-align:center"><h2>DF EXTRUSOR PRO</h2><p>Não foi possível abrir o teste.</p><button onclick="location.reload()" style="margin-top:16px;border:1px solid #f5a000;background:#241600;color:#ffd36a;border-radius:12px;padding:13px 18px;font-weight:900">TENTAR NOVAMENTE</button></div>'}
